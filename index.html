    <title>Расписание пар</title>

            display: flex;

            min-height: 100vh;
            box-sizing: border-box;

        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer-box {

            padding: 30px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .status { font-size: 18px; color: #8e8e93; margin-bottom: 10px; }

        .schedule {
            width: 100%;
            max-width: 350px;
        }
        .lesson {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background-color: #1c1c1e;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .lesson.active { background-color: #0a84ff; color: #fff; }
        .lesson-time { font-weight: bold; }
        .break {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: #2c2c2e;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8e8e93;
        }
        .break.active { background-color: #ff9500; color: #fff; }
        .break-duration { font-weight: bold; color: #ff9500; }
        .break.active .break-duration { color: #fff; }
        .lesson-time { font-weight: bold; }
    </style>
</head>
