<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Расписание 2П1</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .timer {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }
        .status { font-size: 18px; color: #8e8e93; }
        .time { font-size: 48px; font-weight: bold; color: #fff; margin: 10px 0; }
        .info { font-size: 16px; color: #8e8e93; }
        .lesson {
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lesson.active { background: #0a84ff; }
        .lesson-info { text-align: left; flex: 1; }
        .lesson-subject { font-weight: bold; font-size: 14px; }
        .lesson-details { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        .lesson.active .lesson-details { color: #fff; }
        .lesson-time { 
            font-weight: bold; 
            margin-left: 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .lesson-num {
            font-size: 13px;
            color: #0a84ff;
            margin-bottom: 2px;
            font-weight: 800;
        }
        .lesson.active .lesson-num { color: #fff; }
        .break {
            background: #2c2c2e;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
            color: #8e8e93;
            display: flex;
            justify-content: space-between;
        }
        .break.active { background: #ff9500; color: #fff; }
        .day-selector {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .day-btn {
            background: #1c1c1e;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 2px;
            cursor: pointer;
            font-size: 12px;
        }
        .day-btn.active { background: #0a84ff; }
    </style>
</head>
<body>
    <h1>Расписание 2П1</h1>
    <div class="day-selector" id="daySelector"></div>
    <div class="timer" id="timerBlock">
        <div class="status" id="status">Загрузка...</div>
        <div class="time" id="timer">--:--</div>
        <div class="info" id="info"></div>
    </div>
    <div id="schedule"></div>

    <script>
        const timeSlots = [
            { name: "1 пара", start: "09:00", end: "10:30" },
            { name: "2 пара", start: "10:35", end: "12:05" },
            { name: "3 пара", start: "12:35", end: "14:05" },
            { name: "4 пара", start: "14:15", end: "15:45" },
            { name: "5 пара", start: "15:55", end: "17:25" },
            { name: "6 пара", start: "17:40", end: "19:10" }
        ];

        const schedule = {
            "Понедельник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 3, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 4, subject: "Математическое моделирование", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 5, subject: "Численные методы", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 6, subject: "Час куратора", teacher: "Наумова Е.М.", room: "—" }
            ],
            "Вторник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 3, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 4, subject: "Информационные технологии", teacher: "Новиков В.С.", room: "217" },
                { slot: 5, subject: "История России", teacher: "Неменов Б.В.", room: "210" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Среда": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "—", teacher: "", room: "" },
                { slot: 3, subject: "Физкультура", teacher: "Наумова", room: "Спортзал" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "История России (дистант)", teacher: "Неменов Б.В.", room: "онлайн" }
            ],
            "Четверг": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Разработка программных модулей", teacher: "Альбатша А.М.Х.", room: "203" },
                { slot: 3, subject: "Иностранный язык в проф. деятельности", teacher: "Марфина Л.А.", room: "221" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Пятница": [
                { slot: 1, subject: "Основы алгоритмизации и программирования (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 2, subject: "Основы проектирования баз данных (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 3, subject: "—", teacher: "", room: "" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Суббота": [
                { slot: 1, subject: "МДК 04.01 Внедрение и поддержка комп. систем", teacher: "Малькова Е.В.", room: "217" },
                { slot: 2, subject: "Компьютерные сети", teacher: "Малькова Е.В.", room: "217" },
                { slot: 3, subject: "Архитектура аппаратных средств", teacher: "Малькова Е.В.", room: "217" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ]
        };

        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
        const dayMap = { 1: "Понедельник", 2: "Вторник", 3: "Среда", 4: "Четверг", 5: "Пятница", 6: "Суббота", 0: "Понедельник" };

        let selectedDay = dayMap[new Date().getDay()];

        function toMin(t) {
            if (!t) return 0;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function renderSelector() {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';
            days.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${day === selectedDay ? 'active' : ''}`;
                btn.innerText = day;
                btn.onclick = () => {
                    selectedDay = day;
                    renderSelector();
                    update();
                };
                selector.appendChild(btn);
            });
        }

        function update() {
            const now = new Date();
            let currentDayIdx = now.getDay();
            const todayName = dayMap[currentDayIdx];
            
            const todayLessons = schedule[selectedDay];
            const isToday = (selectedDay === todayName);
            
            let activeSlot = null;
            let activeBreak = null;
            let timerText = "--:--";
            let statusText = "Нет пар";
            let infoText = "";

            const curMin = now.getHours() * 60 + now.getMinutes();
            const sec = now.getSeconds();

            if (isToday) {
                let foundStatus = false;

                for (let i = 0; i < timeSlots.length; i++) {
                    const slot = timeSlots[i];
                    const s = toMin(slot.start);
                    const e = toMin(slot.end);

                    if (curMin >= s && curMin < e) {
                        activeSlot = i + 1;
                        statusText = `Идет ${slot.name}`;
                        timerText = formatTime((e - curMin) * 60 - sec);
                        const lesson = todayLessons.find(l => l.slot === activeSlot);
                        infoText = lesson && lesson.subject !== "—" ? lesson.subject : "Окно / Самостоятельно";
                        foundStatus = true;
                        break;
                    }

                    if (i < timeSlots.length - 1) {
                        const nextSlot = timeSlots[i + 1];
                        const nextStart = toMin(nextSlot.start);
                        if (curMin >= e && curMin < nextStart) {
                            activeBreak = i + 1;
                            statusText = "Перерыв";
                            timerText = formatTime((nextStart - curMin) * 60 - sec);
                            infoText = `Следующая: ${nextSlot.name}`;
                            foundStatus = true;
                            break;
                        }
                    }
