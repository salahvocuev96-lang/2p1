<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Расписание 2П1</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .timer {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }
        .status { font-size: 18px; color: #8e8e93; }
        .time { font-size: 48px; font-weight: bold; color: #fff; margin: 10px 0; }
        .info { font-size: 16px; color: #8e8e93; }
        .lesson {
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lesson.active { background: #0a84ff; }
        .lesson-info { text-align: left; flex: 1; }
        .lesson-subject { font-weight: bold; font-size: 14px; }
        .lesson-details { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        .lesson.active .lesson-details { color: #fff; }
        .lesson-time { 
            font-weight: bold; 
            margin-left: 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .lesson-num {
            font-size: 13px;
            color: #0a84ff;
            margin-bottom: 2px;
            font-weight: 800;
        }
        .lesson.active .lesson-num { color: #fff; }
        .break {
            background: #2c2c2e;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
            color: #8e8e93;
            display: flex;
            justify-content: space-between;
        }
        .break.active { background: #ff9500; color: #fff; }
        .day-selector {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .day-btn {
            background: #1c1c1e;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 2px;
            cursor: pointer;
            font-size: 12px;
        }
        .day-btn.active { background: #0a84ff; }
        .search-box {
            background: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 16px;
            width: 90%;
            max-width: 300px;
            outline: none;
            margin-bottom: 10px;
        }
        .search-box:focus {
            border-color: #0a84ff;
        }
        .lesson, .break {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.4s ease forwards;
        }
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }    
    </style>
</head>
<body>
    <h1>Расписание 2П1</h1>
    
    <div style="margin: 15px 0; text-align: center;">
        <input type="text" id="groupSearch" class="search-box" placeholder="🔍 Поиск группы...">
        <br>
        <select id="groupSelect" style="background: #1c1c1e; color: #fff; border: 1px solid #333; padding: 12px 15px; border-radius: 12px; font-size: 16px; width: 90%; max-width: 300px; outline: none;">
            <option value="2p1">2П1</option>
            <option value="1p1">1П1</option>
            <option value="1l1">1Л1</option>
            <option value="1l2">1Л2</option>
            <option value="1b1">1Б1</option>
            <option value="1bd1">1БД1</option>
            <option value="1yu1">1Ю1</option>
            <option value="1yu2">1Ю2</option>
            <option value="2b1">2Б1</option>
            <option value="1b3">1Б3</option>
            <option value="2yu1">2Ю1</option>
            <option value="2yu2">2Ю2</option>
            <option value="1yu3">1Ю3</option>
            <option value="2bd1">2БД1</option>
            <option value="1bd3">1БД3</option>
            <option value="2l1">2Л1</option>
            <option value="1l3">1Л3</option>
            <option value="1p3">1П3</option>
        </select>
    </div>
    
    <div class="day-selector" id="daySelector"></div>
    <div class="timer" id="timerBlock">
        <div class="status" id="status">Загрузка...</div>
        <div class="time" id="timer">--:--</div>
        <div class="info" id="info"></div>
    </div>
    <div id="schedule"></div>

    <script>
        const timeSlots = [
            { name: "1 пара", start: "09:00", end: "10:30" },
            { name: "2 пара", start: "10:35", end: "12:05" },
            { name: "3 пара", start: "12:35", end: "14:05" },
            { name: "4 пара", start: "14:15", end: "15:45" },
            { name: "5 пара", start: "15:55", end: "17:25" },
            { name: "6 пара", start: "17:30", end: "19:00" }
        ];

        const schedule = {
            "Понедельник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 3, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 4, subject: "Математическое моделирование", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 5, subject: "Численные методы", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 6, subject: "Час куратора", teacher: "Наумова Е.М.", room: "—" }
            ],
            "Вторник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 3, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 4, subject: "Информационные технологии", teacher: "Новиков В.С.", room: "217" },
                { slot: 5, subject: "История России", teacher: "Неменов Б.В.", room: "210" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Среда": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "—", teacher: "", room: "" },
                { slot: 3, subject: "Физкультура", teacher: "Наумова", room: "спортзал" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "История России (дистант)", teacher: "Неменов Б.В.", room: "онлайн" }
            ],
            "Четверг": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Разработка программных модулей", teacher: "Альбатша А.М.Х.", room: "203" },
                { slot: 3, subject: "Иностранный язык в проф. деятельности", teacher: "Марфина Л.А.", room: "221" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Пятница": [
                { slot: 1, subject: "Основы алгоритмизации и программирования (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 2, subject: "Основы проектирования баз данных (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 3, subject: "—", teacher: "", room: "" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Суббота": [
                { slot: 1, subject: "МДК 04.01 Внедрение и поддержка комп. систем", teacher: "Малькова Е.В.", room: "217" },
                { slot: 2, subject: "Компьютерные сети", teacher: "Малькова Е.В.", room: "217" },
                { slot: 3, subject: "Архитектура аппаратных средств", teacher: "Малькова Е.В.", room: "217" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ]
        };

        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
        
        const dayMap = { 
            1: "Понедельник", 
            2: "Вторник", 
            3: "Среда", 
            4: "Четверг", 
            5: "Пятница", 
            6: "Суббота", 
            0: "Воскресенье" 
        };

        let selectedDay = (() => {
            const now = new Date();
            const d = now.getDay();
            const hours = now.getHours();
            
            if (d === 0) return "Понедельник";
            
            if (hours >= 19) {
                const nextDay = d === 6 ? 0 : d + 1;
                return nextDay === 0 ? "Понедельник" : dayMap[nextDay];
            }
            
            return dayMap[d];
        })();

        function toMin(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        // Переменные для отслеживания, нужно ли перерисовывать расписание
        let lastRenderedDay = null;
        let lastRenderedGroup = null;

        function update() {
            const now = new Date();
            const todayWeekday = now.getDay();
            const todayName = dayMap[todayWeekday];
            const todayLessons = schedule[selectedDay];
            const isToday = (selectedDay === todayName && todayWeekday !== 0);
            
            let active = null, activeBreak = null, next = null, left = 0;

            if (isToday) {
                const cur = now.getHours() * 60 + now.getMinutes();
                const sec = now.getSeconds();

                for (let lesson of todayLessons) {
                    if (lesson.subject === "—") continue;
                    const slot = timeSlots[lesson.slot - 1];
                    const s = toMin(slot.start), e = toMin(slot.end);
                    if (cur >= s && cur < e) {
                        active = { ...lesson, time: `${slot.start}-${slot.end}` };
                        left = (e - cur) * 60 - sec;
                        break;
                    }
                }

                if (!active) {
                    for (let i = 0; i < todayLessons.length - 1; i++) {
                        if (todayLessons[i].subject === "—" || todayLessons[i+1].subject === "—") continue;
                        const slot1 = timeSlots[todayLessons[i].slot - 1];
                        const slot2 = timeSlots[todayLessons[i+1].slot - 1];
                        const s = toMin(slot1.end), e = toMin(slot2.start);
                        if (cur >= s && cur < e) {
                            activeBreak = { afterSlot: todayLessons[i].slot, dur: e - s };
                            left = (e - cur) * 60 - sec;
                            break;
                        }
                    }
                }

                if (!active && !activeBreak) {
                    for (let lesson of todayLessons) {
                        if (lesson.subject === "—") continue;
                        const slot = timeSlots[lesson.slot - 1];
                        if (cur < toMin(slot.start)) {
                            next = { ...lesson, time: `${slot.start}-${slot.end}` };
                            left = (toMin(slot.start) - cur) * 60 - sec;
                            break;
                        }
                    }
                }
            }

            const h = Math.floor(left / 3600);
            const m = Math.floor((left % 3600) / 60);
            const s = left % 60;
            const t = (h > 0 ? h + 'ч ' : '') + m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');

            const timerBlock = document.getElementById('timerBlock');

            if (isToday) {
                timerBlock.style.display = 'block';
                if (active) {
                    document.getElementById('status').innerText = 'Идет: ' + active.subject;
                    document.getElementById('timer').innerText = t;
                    document.getElementById('info').innerText = 'до конца';
                } else if (activeBreak) {
                    const prevLesson = todayLessons.find(l => l.slot === activeBreak.afterSlot);
                    const prevSubject = prevLesson && prevLesson.subject !== "—" ? prevLesson.subject : "пары";
                    document.getElementById('status').innerText = 'Перемена после ' + prevSubject;
                    document.getElementById('timer').innerText = t;
                    document.getElementById('info').innerText = 'до конца (' + activeBreak.dur + ' мин)';
                } else if (next) {
                    document.getElementById('status').innerText = 'Следующая: ' + next.subject;
                    document.getElementById('timer').innerText = t;
                    document.getElementById('info').innerText = 'до начала';
                } else {
                    timerBlock.style.display = 'none';
                }
            } else {
                timerBlock.style.display = 'none';
            }

            // ПЕРЕРИСОВКА РАСПИСАНИЯ ТОЛЬКО ПРИ СМЕНЕ ДНЯ ИЛИ ГРУППЫ
            if (selectedDay !== lastRenderedDay || currentGroup !== lastRenderedGroup) {
                lastRenderedDay = selectedDay;
                lastRenderedGroup = currentGroup;
                
                const sch = document.getElementById('schedule');
                sch.innerHTML = '';
                let delay = 0;
                
                todayLessons.forEach(lesson => {
                    if (lesson.subject === "—") return;
                    const slot = timeSlots[lesson.slot - 1];
                    const isActive = active && active.slot === lesson.slot;
                    const isBreak = activeBreak && activeBreak.afterSlot === lesson.slot;
                    
                    // Добавлен data-slot для безопасного обновления подсветки каждую секунду
                    sch.innerHTML += `<div class="lesson ${isActive ? 'active' : ''}" style="animation-delay: ${delay}ms" data-slot="${lesson.slot}">
                        <div class="lesson-info">
                            <div class="lesson-subject">${lesson.subject}</div>
                            <div class="lesson-details">👨‍🏫 ${lesson.teacher} | 🚪 ${lesson.room}</div>
                        </div>
                        <div class="lesson-time">
                            <span class="lesson-num">${lesson.slot} пара</span>
                            <span>${slot.start}-${slot.end}</span>
                        </div>
                    </div>`;
                    
                    const nextLesson = todayLessons.find(l => l.slot === lesson.slot + 1 && l.subject !== "—");
                    if (nextLesson) {
                        const nextSlot = timeSlots[nextLesson.slot - 1];
                        const breakDur = toMin(nextSlot.start) - toMin(slot.end);
                        sch.innerHTML += `<div class="break ${isBreak ? 'active' : ''}" style="animation-delay: ${delay}ms" data-slot="${lesson.slot}">
                            <span>Перемена</span>
                            <span>${breakDur} мин</span>
                        </div>`;
                    }
                    delay += 50;
                });

                const selector = document.getElementById('daySelector');
                selector.innerHTML = '';
                days.forEach(day => {
                    const btn = document.createElement('button');
                    btn.className = `day-btn ${day === selectedDay ? 'active' : ''}`;
                    btn.innerText = day.substring(0, 2);
                    btn.onclick = () => { selectedDay = day; update(); };
                    selector.appendChild(btn);
                });
            } else {
                // Если день и группа не менялись, просто обновляем синюю/оранжевую подсветку без перерисовки
                document.querySelectorAll('.lesson').forEach(div => {
                    const slotNum = parseInt(div.getAttribute('data-slot'));
                    if (active && active.slot === slotNum) {
                        div.classList.add('active');
                    } else {
                        div.classList.remove('active');
                    }
                });
                document.querySelectorAll('.break').forEach(div => {
                    const slotNum = parseInt(div.getAttribute('data-slot'));
                    if (activeBreak && activeBreak.afterSlot === slotNum) {
                        div.classList.add('active');
                    } else {
                        div.classList.remove('active');
                    }
                });
            }
        }

        const groupMapping = {
            '1l2': '1l1',
            '1l3': '2l1',
            '1yu3': '2yu2',
            '1bd3': '2bd1'
        };
        
        let currentGroup = localStorage.getItem('selectedGroup') || '2p1';
        document.getElementById('groupSelect').value = currentGroup;
        
        async function loadGroupSchedule(groupCode) {
            try {
                const actualGroup = groupMapping[groupCode] || groupCode;
                const response = await fetch('all-groups.json');
                const allData = await response.json();
                return allData[actualGroup].schedule;
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                return null;
            }
        }
        
        async function changeGroup(groupCode) {
            localStorage.setItem('selectedGroup', groupCode);
            const newSchedule = await loadGroupSchedule(groupCode);
            if (newSchedule) {
                Object.keys(schedule).forEach(day => {
                    schedule[day] = newSchedule[day] || schedule[day];
                });
                document.querySelector('h1').innerText = 'Расписание ' + groupCode.toUpperCase().replace('P', 'П').replace('L', 'Л').replace('D', 'Д').replace('B', 'Б').replace('YU', 'Ю');
                update();
            }
        }
        
        document.getElementById('groupSelect').addEventListener('change', function() {
            changeGroup(this.value);
        });
        
        document.getElementById('groupSearch').addEventListener('input', function() {
            const searchText = this.value.toLowerCase();
            const select = document.getElementById('groupSelect');
            const options = select.options;
            
            for (let i = 0; i < options.length; i++) {
                const optionText = options[i].text.toLowerCase();
                if (optionText.includes(searchText)) {
                    options[i].style.display = '';
                } else {
                    options[i].style.display = 'none';
                }
            }
            
            if (searchText.length > 0) {
                for (let i = 0; i < options.length; i++) {
                    if (options[i].text.toLowerCase() === searchText) {
                        select.value = options[i].value;
                        changeGroup(options[i].value);
                        break;
                    }
                }
            }
        });
        
        if (currentGroup !== '2p1') {
            changeGroup(currentGroup);
        }
        
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
