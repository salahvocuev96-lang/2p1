<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Расписание 2П1</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(270deg, #000000, #080818, #100a1a, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            padding: 20px 20px 60px 20px;
            text-align: center;
            min-height: 100vh;
        }
        
        /* === ГРАДИЕНТНЫЙ ЗАГОЛОВОК С ГОЛУБЫМ ОТТЕНКОМ === */
        h1.main-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 10px 0 8px 0;
            background: linear-gradient(
                90deg,
                #d0e8ff 0%,
                #ffffff 25%,
                #ffffff 50%,
                #ffffff 75%,
                #d0e8ff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite;
            filter: drop-shadow(0 0 25px rgba(180, 220, 255, 0.5));
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* === ЖИВАЯ ДАТА ПОД ЗАГОЛОВКОМ === */
        .live-date {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .live-date .date-text {
            font-weight: 500;
            color: #c8d8e8;
        }

        .live-date .divider {
            width: 4px;
            height: 4px;
            background: #5a7a9a;
            border-radius: 50%;
        }

        .live-date .lessons-count {
            color: #c8d8e8;
            font-weight: 600;
        }

        .live-date .lessons-count strong {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        .update-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #30d158;
            opacity: 0;
            transition: opacity 0.4s;
            margin-top: 6px;
            min-height: 16px;
        }

        .update-indicator.show {
            opacity: 1;
        }

        .update-indicator .dot {
            width: 6px;
            height: 6px;
            background: #30d158;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .timer {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }
        .status { font-size: 18px; color: #8e8e93; }
        
        /* Барабанный эффект (Odometer) */
        .odometer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 10px 0;
        }
        .digit-wrapper {
            position: relative;
            width: 50px;
            height: 70px;
            overflow: hidden;
            border-radius: 10px;
            background: #0a0a0a;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        .digit-wrapper::before,
        .digit-wrapper::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 25px;
            z-index: 2;
            pointer-events: none;
        }
        .digit-wrapper::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .digit-wrapper::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .digit-strip span {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 300;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .separator {
            font-size: 48px;
            font-weight: 300;
            color: #0a84ff;
            animation: blink 1s ease infinite;
            margin: 0 2px;
        }
        .hours-label {
            font-size: 24px;
            color: #8e8e93;
            margin-left: 4px;
            margin-right: 8px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .info { font-size: 16px; color: #8e8e93; }
        .progress-track {
            width: 100%;
            height: 4px;
            background: #333333;
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #0a84ff;
            width: 100%;
            border-radius: 2px;
            transition: width 1s linear;
        }
        .lesson-wrapper {
            perspective: 1000px;
            margin: 8px 0;
        }
        .lesson {
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .lesson::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at var(--mx, 50%) var(--my, 50%),
                rgba(255,255,255,0.15) 0%,
                transparent 60%
            );
            opacity: var(--glow, 0);
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 2;
        }
        .lesson-info, .lesson-time {
            transform: translateZ(25px);
            position: relative;
            z-index: 1;
        }
        .lesson.active { background: #0a84ff; }
        .lesson-info { text-align: left; flex: 1; }
        .lesson-subject { font-weight: bold; font-size: 14px; }
        .lesson-details { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        .lesson.active .lesson-details { color: #fff; }
        .lesson-time { 
            font-weight: bold; 
            margin-left: 10px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .lesson-num {
            font-size: 13px;
            color: #0a84ff;
            margin-bottom: 2px;
            font-weight: 800;
        }
        .lesson.active .lesson-num { color: #fff; }
        .break {
            background: #2c2c2e;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
            color: #8e8e93;
            display: flex;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .break.active { background: #ff9500; color: #fff; }
        .day-selector {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .day-btn {
            background: #1c1c1e;
            border: none;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 2px;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .day-btn.active { background: #0a84ff; }
        .day-btn:hover {
            transform: scale(1.05);
        }
        .search-box {
            background: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 16px;
            width: 90%;
            max-width: 300px;
            outline: none;
            margin-bottom: 10px;
        }
        .search-box:focus {
            border-color: #0a84ff;
        }
        
        /* Blur Cascade анимация */
        .lesson, .break {
            opacity: 0;
            filter: blur(8px);
            transform: translateY(-15px);
        }
        .lesson.animate, .break.animate {
            animation: blurIn 0.5s ease forwards;
        }
        @keyframes blurIn {
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .lesson:hover, .break:hover {
            box-shadow: 0 8px 20px rgba(10, 132, 255, 0.15);
        }
    </style>
</head>
<body>
    <h1 class="main-title" id="mainTitle">Расписание 2П1</h1>
    
    <div class="live-date">
        <span class="date-text" id="dateText">Загрузка...</span>
        <span class="divider"></span>
        <span class="lessons-count" id="lessonsCount">Загрузка...</span>
    </div>
    <div class="update-indicator" id="updateIndicator">
        <span class="dot"></span>
        <span>Обновлено</span>
    </div>
    
    <div style="margin: 15px 0; text-align: center;">
        <input type="text" id="groupSearch" class="search-box" placeholder="🔍 Поиск группы...">
        <br>
        <select id="groupSelect" style="background: #1c1c1e; color: #fff; border: 1px solid #333; padding: 12px 15px; border-radius: 12px; font-size: 16px; width: 90%; max-width: 300px; outline: none;">
            <option value="2p1">2П1</option>
            <option value="1p1">1П1</option>
            <option value="1l1">1Л1</option>
            <option value="1l2">1Л2</option>
            <option value="1b1">1Б1</option>
            <option value="1bd1">1БД1</option>
            <option value="1yu1">1Ю1</option>
            <option value="1yu2">1Ю2</option>
            <option value="2b1">2Б1</option>
            <option value="1b3">1Б3</option>
            <option value="2yu1">2Ю1</option>
            <option value="2yu2">2Ю2</option>
            <option value="1yu3">1Ю3</option>
            <option value="2bd1">2БД1</option>
            <option value="1bd3">1БД3</option>
            <option value="2l1">2Л1</option>
            <option value="1l3">1Л3</option>
            <option value="1p3">1П3</option>
        </select>
    </div>
    
    <div class="day-selector" id="daySelector"></div>
    
    <div class="timer" id="timerBlock">
        <div class="status" id="status">Загрузка...</div>
        <div class="odometer">
            <div class="digit-wrapper"><div class="digit-strip" id="hour1"></div></div>
            <div class="hours-label">ч</div>
            <div class="digit-wrapper"><div class="digit-strip" id="min1"></div></div>
            <div class="digit-wrapper"><div class="digit-strip" id="min2"></div></div>
            <div class="separator">:</div>
            <div class="digit-wrapper"><div class="digit-strip" id="sec1"></div></div>
            <div class="digit-wrapper"><div class="digit-strip" id="sec2"></div></div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="info" id="info"></div>
    </div>
    
    <div id="schedule"></div>

    <script>
        const timeSlots = [
            { name: "1 пара", start: "09:00", end: "10:30" },
            { name: "2 пара", start: "10:35", end: "12:05" },
            { name: "3 пара", start: "12:35", end: "14:05" },
            { name: "4 пара", start: "14:15", end: "15:45" },
            { name: "5 пара", start: "15:55", end: "17:25" },
            { name: "6 пара", start: "17:30", end: "19:00" }
        ];

        const schedule = {
            "Понедельник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 3, subject: "Операционные системы", teacher: "Альбатша А.М.Х.", room: "217" },
                { slot: 4, subject: "Математическое моделирование", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 5, subject: "Численные методы", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 6, subject: "Час куратора", teacher: "Наумова Е.М.", room: "—" }
            ],
            "Вторник": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 3, subject: "Электронная высшая математика", teacher: "Кудинова С.Л.", room: "201" },
                { slot: 4, subject: "Информационные технологии", teacher: "Новиков В.С.", room: "217" },
                { slot: 5, subject: "История России", teacher: "Неменов Б.В.", room: "210" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Среда": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "—", teacher: "", room: "" },
                { slot: 3, subject: "Физкультура", teacher: "Наумова", room: "спортзал" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "История России (дистант)", teacher: "Неменов Б.В.", room: "онлайн" }
            ],
            "Четверг": [
                { slot: 1, subject: "—", teacher: "", room: "" },
                { slot: 2, subject: "Разработка программных модулей", teacher: "Альбатша А.М.Х.", room: "203" },
                { slot: 3, subject: "Иностранный язык в проф. деятельности", teacher: "Марфина Л.А.", room: "221" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Пятница": [
                { slot: 1, subject: "Основы алгоритмизации и программирования (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 2, subject: "Основы проектирования баз данных (дистант)", teacher: "Голеусов Р.О.", room: "онлайн" },
                { slot: 3, subject: "—", teacher: "", room: "" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ],
            "Суббота": [
                { slot: 1, subject: "МДК 04.01 Внедрение и поддержка комп. систем", teacher: "Малькова Е.В.", room: "217" },
                { slot: 2, subject: "Компьютерные сети", teacher: "Малькова Е.В.", room: "217" },
                { slot: 3, subject: "Архитектура аппаратных средств", teacher: "Малькова Е.В.", room: "217" },
                { slot: 4, subject: "—", teacher: "", room: "" },
                { slot: 5, subject: "—", teacher: "", room: "" },
                { slot: 6, subject: "—", teacher: "", room: "" }
            ]
        };

        const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
        const dayMap = { 1: "Понедельник", 2: "Вторник", 3: "Среда", 4: "Четверг", 5: "Пятница", 6: "Суббота", 0: "Воскресенье" };
        const monthNames = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

        let selectedDay = (() => {
            const now = new Date();
            const d = now.getDay();
            const hours = now.getHours();
            if (d === 0) return "Понедельник";
            if (hours >= 19) {
                const nextDay = d === 6 ? 0 : d + 1;
                return nextDay === 0 ? "Понедельник" : dayMap[nextDay];
            }
            return dayMap[d];
        })();

        function toMin(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function fadeText(elementId, newText) {
            const element = document.getElementById(elementId);
            if (element.innerText === newText) return;
            element.style.opacity = '0';
            setTimeout(() => {
                element.innerText = newText;
                element.style.opacity = '1';
            }, 200);
        }

        // === БАРАБАННЫЙ ТАЙМЕР ===
        const DIGIT_HEIGHT = 70;
        function createStrip(elementId) {
            const strip = document.getElementById(elementId);
            if (!strip) return;
            strip.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const span = document.createElement('span');
                span.textContent = i;
                strip.appendChild(span);
            }
        }
        
        function setDigit(elementId, value) {
            const strip = document.getElementById(elementId);
            if (strip) {
                const safeValue = Math.max(0, Math.min(9, Math.floor(value)));
                strip.style.transform = `translateY(-${safeValue * DIGIT_HEIGHT}px)`;
            }
        }

        function displayOdometer(totalSeconds) {
            if (typeof totalSeconds !== 'number' || isNaN(totalSeconds) || totalSeconds < 0) {
                totalSeconds = 0;
            }
            
            const hours = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            
            setDigit('hour1', hours > 9 ? 9 : hours);
            setDigit('min1', Math.floor(mins / 10));
            setDigit('min2', mins % 10);
            setDigit('sec1', Math.floor(secs / 10));
            setDigit('sec2', secs % 10);
        }

        createStrip('hour1');
        createStrip('min1'); 
        createStrip('min2'); 
        createStrip('sec1'); 
        createStrip('sec2');

        // === ЖИВАЯ ДАТА ===
        function getLessonsWord(count) {
            const lastTwo = count % 100;
            const lastOne = count % 10;
            if (lastTwo >= 11 && lastTwo <= 19) return 'пар';
            if (lastOne === 1) return 'пара';
            if (lastOne >= 2 && lastOne <= 4) return 'пары';
            return 'пар';
        }

        function updateLiveDate(showIndicator = false) {
            const now = new Date();
            const dayName = dayMap[now.getDay()] || '';
            const day = now.getDate();
            const month = monthNames[now.getMonth()];
            const dateText = document.getElementById('dateText');
            const lessonsCount = document.getElementById('lessonsCount');
            const updateIndicator = document.getElementById('updateIndicator');
            
            if (dateText) dateText.textContent = `${dayName}, ${day} ${month}`;
            
            if (lessonsCount && schedule[selectedDay]) {
                const count = schedule[selectedDay].filter(l => l.subject !== "—").length;
                if (count === 0) {
                    lessonsCount.innerHTML = '<strong>Пар нет</strong>';
                } else {
                    lessonsCount.innerHTML = `<strong>${count}</strong> ${getLessonsWord(count)} сегодня`;
                }
            }
            
            // Показываем индикатор только если явно попросили (при смене группы)
            if (showIndicator && updateIndicator) {
                updateIndicator.classList.add('show');
                setTimeout(() => updateIndicator.classList.remove('show'), 2000);
            }
        }

        let lastRenderedDay = null;
        let lastRenderedGroup = null;

        function update() {
            const now = new Date();
            const todayWeekday = now.getDay();
            const todayName = dayMap[todayWeekday];
            const todayLessons = schedule[selectedDay];
            const isToday = (selectedDay === todayName && todayWeekday !== 0);
            
            let active = null, activeBreak = null, next = null, left = 0;

            if (isToday) {
                const cur = now.getHours() * 60 + now.getMinutes();
                const sec = now.getSeconds();

                for (let lesson of todayLessons) {
                    if (lesson.subject === "—") continue;
                    const slot = timeSlots[lesson.slot - 1];
                    const s = toMin(slot.start), e = toMin(slot.end);
                    if (cur >= s && cur < e) {
                        active = { ...lesson, time: `${slot.start}-${slot.end}` };
                        left = (e - cur) * 60 - sec;
                        break;
                    }
                }

                if (!active) {
                    for (let i = 0; i < todayLessons.length - 1; i++) {
                        if (todayLessons[i].subject === "—" || todayLessons[i+1].subject === "—") continue;
                        const slot1 = timeSlots[todayLessons[i].slot - 1];
                        const slot2 = timeSlots[todayLessons[i+1].slot - 1];
                        const s = toMin(slot1.end), e = toMin(slot2.start);
                        if (cur >= s && cur < e) {
                            activeBreak = { afterSlot: todayLessons[i].slot, dur: e - s };
                            left = (e - cur) * 60 - sec;
                            break;
                        }
                    }
                }

                if (!active && !activeBreak) {
                    for (let lesson of todayLessons) {
                        if (lesson.subject === "—") continue;
                        const slot = timeSlots[lesson.slot - 1];
                        if (cur < toMin(slot.start)) {
                            next = { ...lesson, time: `${slot.start}-${slot.end}` };
                            left = (toMin(slot.start) - cur) * 60 - sec;
                            if (left < 0) left = 0;
                            break;
                        }
                    }
                }
            }

            const progressBar = document.getElementById('progressBar');
            if (isToday && active) {
                const slot = timeSlots[active.slot - 1];
                const totalDuration = toMin(slot.end) - toMin(slot.start);
                const elapsed = totalDuration - (left / 60);
                const percent = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
                progressBar.style.width = percent + '%';
            } else if (isToday && activeBreak) {
                const totalDuration = activeBreak.dur;
                const elapsed = totalDuration - (left / 60);
                const percent = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
                progressBar.style.width = percent + '%';
            } else {
                progressBar.style.width = '0%';
            }

            const timerBlock = document.getElementById('timerBlock');

            if (isToday) {
                timerBlock.style.display = 'block';
                if (active) {
                    fadeText('status', 'Идет: ' + active.subject);
                    displayOdometer(left);
                    fadeText('info', 'до конца');
                } else if (activeBreak) {
                    const prevLesson = todayLessons.find(l => l.slot === activeBreak.afterSlot);
                    const prevSubject = prevLesson && prevLesson.subject !== "—" ? prevLesson.subject : "пары";
                    fadeText('status', 'Перемена после ' + prevSubject);
                    displayOdometer(left);
                    fadeText('info', 'до конца (' + activeBreak.dur + ' мин)');
                } else if (next) {
                    fadeText('status', 'Следующая: ' + next.subject);
                    displayOdometer(left);
                    fadeText('info', 'до начала');
                } else {
                    fadeText('status', 'Пары закончились');
                    displayOdometer(0);
                    fadeText('info', 'до завтра');
                }
            } else {
                timerBlock.style.display = 'none';
            }

            if (selectedDay !== lastRenderedDay || currentGroup !== lastRenderedGroup) {
                lastRenderedDay = selectedDay;
                lastRenderedGroup = currentGroup;
                
                const sch = document.getElementById('schedule');
                sch.innerHTML = '';
                
                todayLessons.forEach(lesson => {
                    if (lesson.subject === "—") return;
                    const slot = timeSlots[lesson.slot - 1];
                    const isActive = active && active.slot === lesson.slot;
                    const isBreak = activeBreak && activeBreak.afterSlot === lesson.slot;
                    
                    sch.innerHTML += `<div class="lesson-wrapper">
                        <div class="lesson ${isActive ? 'active' : ''}" data-slot="${lesson.slot}">
                            <div class="lesson-info">
                                <div class="lesson-subject">${lesson.subject}</div>
                                <div class="lesson-details">👨🏫 ${lesson.teacher} | 🚪 ${lesson.room}</div>
                            </div>
                            <div class="lesson-time">
                                <span class="lesson-num">${lesson.slot} пара</span>
                                <span>${slot.start}-${slot.end}</span>
                            </div>
                        </div>
                    </div>`;
                    
                    const nextLesson = todayLessons.find(l => l.slot === lesson.slot + 1 && l.subject !== "—");
                    if (nextLesson) {
                        const nextSlot = timeSlots[nextLesson.slot - 1];
                        const breakDur = toMin(nextSlot.start) - toMin(slot.end);
                        sch.innerHTML += `<div class="break ${isBreak ? 'active' : ''}" data-slot="${lesson.slot}">
                            <span>Перемена</span>
                            <span>${breakDur} мин</span>
                        </div>`;
                    }
                });

                setTimeout(() => {
                    const elements = sch.querySelectorAll('.lesson, .break');
                    elements.forEach((el, index) => {
                        setTimeout(() => {
                            el.classList.add('animate');
                        }, index * 80);
                    });
                }, 100);

                const selector = document.getElementById('daySelector');
                selector.innerHTML = '';
                days.forEach(day => {
                    const btn = document.createElement('button');
                    btn.className = `day-btn ${day === selectedDay ? 'active' : ''}`;
                    btn.innerText = day.substring(0, 2);
                    btn.onclick = () => { selectedDay = day; update(); };
                    selector.appendChild(btn);
                });
            } else {
                document.querySelectorAll('.lesson').forEach(div => {
                    const slotNum = parseInt(div.getAttribute('data-slot'));
                    if (active && active.slot === slotNum) {
                        div.classList.add('active');
                    } else {
                        div.classList.remove('active');
                    }
                });
                document.querySelectorAll('.break').forEach(div => {
                    const slotNum = parseInt(div.getAttribute('data-slot'));
                    if (activeBreak && activeBreak.afterSlot === slotNum) {
                        div.classList.add('active');
                    } else {
                        div.classList.remove('active');
                    }
                });
            }
            
            // Обновляем живую дату без индикатора при каждом тике
            updateLiveDate(false);
        }

        // === 3D ЭФФЕКТ ===
        const scheduleContainer = document.getElementById('schedule');
        const handleTilt = (e, clientX, clientY) => {
            const card = e.target.closest('.lesson');
            if (!card) return;
            const rect = card.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            card.style.setProperty('--mx', (x / rect.width) * 100 + '%');
            card.style.setProperty('--my', (y / rect.height) * 100 + '%');
            card.style.setProperty('--glow', '1');
        };
        const handleReset = (e) => {
            const card = e.target.closest('.lesson');
            if (!card) return;
            card.style.transform = 'rotateX(0) rotateY(0)';
            card.style.setProperty('--glow', '0');
        };

        scheduleContainer.addEventListener('mousemove', (e) => handleTilt(e, e.clientX, e.clientY));
        scheduleContainer.addEventListener('mouseleave', handleReset);
        scheduleContainer.addEventListener('touchstart', (e) => handleTilt(e, e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        scheduleContainer.addEventListener('touchmove', (e) => handleTilt(e, e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        scheduleContainer.addEventListener('touchend', handleReset);
        scheduleContainer.addEventListener('touchcancel', handleReset);
        scheduleContainer.addEventListener('click', handleReset);

        const groupMapping = { '1l2': '1l1', '1l3': '2l1', '1yu3': '2yu2', '1bd3': '2bd1' };
        let currentGroup = localStorage.getItem('selectedGroup') || '2p1';
        document.getElementById('groupSelect').value = currentGroup;
        
        async function loadGroupSchedule(groupCode) {
            try {
                const actualGroup = groupMapping[groupCode] || groupCode;
                const response = await fetch('all-groups.json');
                const allData = await response.json();
                return allData[actualGroup].schedule;
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                return null;
            }
        }
        
        async function changeGroup(groupCode) {
            currentGroup = groupCode;
            localStorage.setItem('selectedGroup', groupCode);
            const newSchedule = await loadGroupSchedule(groupCode);
            if (newSchedule) {
                Object.keys(schedule).forEach(day => {
                    schedule[day] = newSchedule[day] || schedule[day];
                });
                document.getElementById('mainTitle').innerText = 'Расписание ' + groupCode.toUpperCase().replace('P', 'П').replace('L', 'Л').replace('D', 'Д').replace('B', 'Б').replace('YU', 'Ю');
                update();
                // СРАЗУ обновляем количество пар с индикатором
                updateLiveDate(true);
            }
        }
        
        document.getElementById('groupSelect').addEventListener('change', function() { changeGroup(this.value); });
        document.getElementById('groupSearch').addEventListener('input', function() {
            const searchText = this.value.toLowerCase();
            const select = document.getElementById('groupSelect');
            for (let i = 0; i < select.options.length; i++) {
                select.options[i].style.display = select.options[i].text.toLowerCase().includes(searchText) ? '' : 'none';
                if (searchText.length > 0 && select.options[i].text.toLowerCase() === searchText) {
                    select.value = select.options[i].value;
                    changeGroup(select.options[i].value);
                    break;
                }
            }
        });
        
        if (currentGroup !== '2p1') changeGroup(currentGroup);
        
        setInterval(update, 1000);
        update();
        // Первый вызов БЕЗ индикатора
        updateLiveDate(false);
    </script>
</body>
</html>
