<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Расписание</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .timer {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }
        .status { font-size: 18px; color: #8e8e93; }
        .time { font-size: 48px; font-weight: bold; color: #0a84ff; margin: 10px 0; }
        .info { font-size: 16px; color: #8e8e93; }
        .lesson {
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .lesson.active { background: #0a84ff; }
        .break {
            background: #2c2c2e;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
            color: #8e8e93;
        }
        .break.active { background: #ff9500; color: #fff; }
    </style>
</head>
<body>
    <h1>Мои пары</h1>
    <div class="timer">
        <div class="status" id="status">Загрузка...</div>
        <div class="time" id="timer">--:--</div>
        <div class="info" id="info"></div>
    </div>
    <div id="schedule"></div>

    <script>
        const lessons = [
            { name: "1 пара", start: "09:00", end: "10:30" },
            { name: "2 пара", start: "10:35", end: "12:05" },
            { name: "3 пара", start: "12:35", end: "14:05" },
            { name: "4 пара", start: "14:15", end: "15:45" },
            { name: "5 пара", start: "15:55", end: "17:25" },
            { name: "6 пара", start: "17:30", end: "19:00" }
        ];

        const breaks = [
            { after: "1 пара", duration: 5 },
            { after: "2 пара", duration: 30 },
            { after: "3 пара", duration: 10 },
            { after: "4 пара", duration: 10 },
            { after: "5 пара", duration: 5 }
        ];

        function toMin(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function update() {
            const now = new Date();
            const cur = now.getHours() * 60 + now.getMinutes();
            const sec = now.getSeconds();
            
            let active = null, activeBreak = null, next = null, left = 0;

            for (let l of lessons) {
                const s = toMin(l.start), e = toMin(l.end);
                if (cur >= s && cur < e) {
                    active = l;
                    left = (e - cur) * 60 - sec;
                    break;
                }
            }

            if (!active) {
                for (let i = 0; i < lessons.length - 1; i++) {
                    const s = toMin(lessons[i].end), e = toMin(lessons[i+1].start);
                    if (cur >= s && cur < e) {
                        activeBreak = { after: lessons[i].name, dur: breaks[i].duration };
                        left = (e - cur) * 60 - sec;
                        break;
                    }
                }
            }

            if (!active && !activeBreak) {
                for (let l of lessons) {
                    if (cur < toMin(l.start)) {
                        next = l;
                        left = (toMin(l.start) - cur) * 60 - sec;
                        break;
                    }
                }
            }

            const h = Math.floor(left / 3600);
            const m = Math.floor((left % 3600) / 60);
            const s = left % 60;
            const t = (h > 0 ? h + 'ч ' : '') + m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');

            if (active) {
                document.getElementById('status').innerText = 'Идет: ' + active.name;
                document.getElementById('timer').innerText = t;
                document.getElementById('info').innerText = 'до конца';
            } else if (activeBreak) {
                document.getElementById('status').innerText = 'Перемена после ' + activeBreak.after;
                document.getElementById('timer').innerText = t;
                document.getElementById('info').innerText = 'до конца (' + activeBreak.dur + ' мин)';
            } else if (next) {
                document.getElementById('status').innerText = 'Следующая: ' + next.name;
                document.getElementById('timer').innerText = t;
                document.getElementById('info').innerText = 'до начала';
            } else {
                document.getElementById('status').innerText = 'Пары закончились';
                document.getElementById('timer').innerText = 'Отдыхай!';
                document.getElementById('info').innerText = '';
            }

            const sch = document.getElementById('schedule');
            sch.innerHTML = '';
            lessons.forEach((l, i) => {
                sch.innerHTML += '<div class="lesson ' + (active && active.name === l.name ? 'active' : '') + '"><span>' + l.name + '</span><span>' + l.start + ' - ' + l.end + '</span></div>';
                if (i < breaks.length) {
                    sch.innerHTML += '<div class="break ' + (activeBreak && activeBreak.after === l.name ? 'active' : '') + '"><span>Перемена</span><span>' + breaks[i].duration + ' мин</span></div>';
                }
            });
        }

        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
