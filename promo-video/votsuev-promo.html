<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Votsuev Promo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
  #hint{position:fixed;left:12px;bottom:10px;color:#776;font:12px 'JetBrains Mono',monospace}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">клик — play/pause · ← → — перемотка</div>
<script>
/* Votsuev — 23 c промо. Детерминированный таймлайн: renderAt(t) рисует кадр строго по времени. */
const V=new URLSearchParams(location.search).has('v'),W=V?1080:1920,H=V?1920:1080,FPS=60,DUR=23,SH=0.5/60; // SH — выдержка (180°) для motion blur
const cv=document.getElementById('c');cv.width=W;cv.height=H;if(V)cv.style.cssText='width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw';let ctx=cv.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');
const SANS="'Inter Display','Inter',sans-serif",MONO="'JetBrains Mono',monospace";
const GOLD='#ffb347',ORANGE='#ff7a1a';

/* ---------- math ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const sm=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const eo=k=>1-Math.pow(1-clamp(k),3),eo5=k=>1-Math.pow(1-clamp(k),5);
const eio=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const back=k=>{k=clamp(k);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const bump=(a,b,c,t)=>sm(a,b,t)*(1-sm(b,c,t));
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>mul(a,1/Math.hypot(a[0],a[1],a[2]));
const L3=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const fmod=(a,n)=>((a%n)+n)%n;

/* ---------- world anchors ---------- */
const NEB=[450,0,1500];          // туманность «хаос клиентов»
const SITE=[560,-80,10600];      // сайт, собранный из частиц (и центр радара)
const COLZ=SITE[2]+1650;         // плоскость колонок-метрик
const TILT=0.5;                  // наклон плоскости радара

/* ---------- camera: keyframes [t, pos xyz, target xyz, roll] ---------- */
const KF=[
 [0.0,   0,  0,-420,  -170,  0,1500, 0],
 [2.2, -40, 15,-230,  -150,  0,1500, .012],
 [4.15,-60, 25,  30,  -120,  0,1500, .02],
 [4.45, 120, 15, 520,   420,  0,1600, 0],
 [4.95, 430,  0,1330,   520,-20,2700,-.03],
 [6.7,  470,-40,1600,   640,-70,2950,-.045],
 [8.45, 520,-70,1930,   580,-80,3300,-.02],
 [9.2,  540,-80,3700,   560,-80,7000, 0],
 [10.2, 555,-80,7600,   400,-80,11000,.005],
 [11.0, 560,-80,9300,    20,-80,10600,.012],
 [12.3, 430,-150,9420,  -90,-60,10600,.02],
 [13.4, 300,-200,9480,  880,-90,10600,-.01],
 [14.6, 330,-120,9480,  930,-80,10600,-.025],
 [15.9, 460,-60,9520,   960,-80,10600,-.03],
 [16.45,560,-90,9980,   560,-80,12300, 0],
 [16.95,560,-80,10850,  560,-80,12300, 0],
 [19.4, 560,-82,11090,  560,-80,12300,.004],
 [23.0, 560,-80,11160,  560,-80,12300, 0],
];
function hermite(t){
  let i=0;while(i<KF.length-2&&t>=KF[i+1][0])i++;
  const p1=KF[i],p2=KF[i+1],p0=KF[i-1]||p1,p3=KF[i+2]||p2,dt=p2[0]-p1[0];
  const u=clamp((t-p1[0])/dt),u2=u*u,u3=u2*u;
  const h00=2*u3-3*u2+1,h10=u3-2*u2+u,h01=-2*u3+3*u2,h11=u3-u2,o=[];
  for(let j=1;j<8;j++){
    const m1=(p0===p1?(p2[j]-p1[j]):(p2[j]-p0[j])/(p2[0]-p0[0])*dt)*.85;
    const m2=(p3===p2?(p2[j]-p1[j]):(p3[j]-p1[j])/(p3[0]-p1[0])*dt)*.85;
    o.push(h00*p1[j]+h10*m1+h01*p2[j]+h11*m2);
  }
  return o;
}
const FS=V?.6:1;
// вертикаль: сдвиг центра 3D-проекции, чтобы объект сцены стоял в кадре 9:16
function OFF(t){if(!V)return[0,0];const s1=1-sm(4.2,4.8,t),s3=sm(10.9,11.5,t)*(1-sm(13,13.6,t)),s4=sm(13,13.6,t)*(1-sm(16.2,16.6,t));
  return[-200*s1-470*s3-75*s4,220*s1+220*s3]}
function focal(t){return 1000-300*bump(8.45,9.4,10.9,t)}
function camAt(t){
  const k=hermite(t);let pos=[k[0],k[1],k[2]],tg=[k[3],k[4],k[5]];
  // «ручная» микроподвижность + удары камеры на акцентах
  const w5=sm(16.42,16.66,t);
  if(w5>0){const px=panX5(t);tg=L3(tg,[px,10,COLZ],w5);pos=L3(pos,[px-120,-20,COLZ-1000],w5)}
  const shake=6*bump(8.45,8.5,9.1,t)+3*bump(20.72,20.76,21.2,t);
  tg=add(tg,[Math.sin(t*1.3)*6+Math.sin(t*47)*shake,Math.sin(t*1.7+1)*5+Math.cos(t*53)*shake,0]);
  const f=norm(sub(tg,pos));let r=norm(cross([0,1,0],f)),dn=cross(f,r);
  const c=Math.cos(k[6]),s=Math.sin(k[6]);
  const r2=add(mul(r,c),mul(dn,s)),d2=sub(mul(dn,c),mul(r,s));
  const o=OFF(t);return {pos,f,r:r2,dn:d2,F:focal(t)*FS,ox:o[0],oy:o[1]};
}
function proj(p,c){
  const d=sub(p,c.pos),z=dot(d,c.f);if(z<25)return null;
  const s=c.F/z;return {x:W/2+c.ox+dot(d,c.r)*s,y:H/2+c.oy+dot(d,c.dn)*s,s,z};
}
function unproj(c,sx,sy,depth){
  return add(add(add(c.pos,mul(c.f,depth)),mul(c.r,(sx-W/2-c.ox)*depth/c.F)),mul(c.dn,(sy-H/2-c.oy)*depth/c.F));
}

/* ---------- sprites (свечение + DOF-уровни) ---------- */
const COLS=[[255,190,95],[255,128,40],[255,228,175],[160,196,255]];
const SPR=COLS.map(c=>[0,1,2,3,4,5].map(l=>{
  const S=64,cn=document.createElement('canvas');cn.width=cn.height=S;const g=cn.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  const core=l===0?.16:l===1?.3:.5+l*.06;
  gr.addColorStop(0,`rgba(${Math.min(255,c[0]+40)},${Math.min(255,c[1]+50)},${Math.min(255,c[2]+60)},1)`);
  gr.addColorStop(core,`rgba(${c[0]},${c[1]},${c[2]},${l===0?.55:.42})`);
  gr.addColorStop(l===0?.45:.85,`rgba(${c[0]},${c[1]},${c[2]},${l===0?.08:.1})`);
  gr.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
  g.fillStyle=gr;g.fillRect(0,0,S,S);return cn;}));
// зерно плёнки
const GR=document.createElement('canvas');GR.width=GR.height=256;{const g=GR.getContext('2d'),id=g.createImageData(256,256),r=rng(99);
  for(let i=0;i<id.data.length;i+=4){const v=r()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);}

/* ---------- сайт: модель из отрезков (локальные координаты, y вниз, z — слой) ---------- */
const SEG=[],FILL=[];
const rectO=(x1,y1,x2,y2,z)=>SEG.push([x1,y1,x2,y1,z],[x2,y1,x2,y2,z],[x2,y2,x1,y2,z],[x1,y2,x1,y1,z]);
const line=(x1,y1,x2,y2,z)=>SEG.push([x1,y1,x2,y2,z]);
const rectF=(x1,y1,x2,y2,z,w)=>FILL.push([x1,y1,x2,y2,z,w]);
rectO(-460,-290,460,290,0);line(-460,-245,460,-245,0);
rectO(-260,-276,140,-258,0);
rectF(-425,-216,-345,-196,-15,.4);
line(150,-206,215,-206,-15);line(240,-206,305,-206,-15);line(330,-206,410,-206,-15);
rectF(-420,-165,40,-138,-45,1);rectF(-420,-122,-70,-95,-45,1);
line(-420,-62,-110,-62,-45);line(-420,-44,-190,-44,-45);
rectO(-420,-10,-235,36,-95);rectF(-420,-10,-235,36,-95,1.1);
rectO(90,-170,420,40,-30);
line(110,20,210,-62,-30);line(210,-62,285,0,-30);line(285,0,335,-34,-30);line(335,-34,400,20,-30);
for(let a=0;a<12;a++){const a1=a/12*6.283,a2=(a+1)/12*6.283;line(345+Math.cos(a1)*24,-112+Math.sin(a1)*24,345+Math.cos(a2)*24,-112+Math.sin(a2)*24,-30)}
[[-420,-150],[-130,140],[160,420]].forEach(([a,b])=>{rectO(a,90,b,250,-60);line(a+20,200,b-60,200,-60);line(a+20,222,b-110,222,-60);rectF(a+20,108,a+90,160,-60,.25)});
const segLen=SEG.map(s=>Math.hypot(s[2]-s[0],s[3]-s[1])),segTot=segLen.reduce((a,b)=>a+b,0);
const fillA=FILL.map(f=>(f[2]-f[0])*(f[3]-f[1])*f[4]),fillTot=fillA.reduce((a,b)=>a+b,0);
const BTN=[SITE[0]-327,SITE[1]+13,SITE[2]-95];

/* ---------- частицы ---------- */
const NM=1150,ND=760,M=[],D=[];
{const r=rng(7);
for(let i=0;i<NM;i++){
  const th=r()*6.283,ph=Math.acos(2*r()-1),rr=Math.pow(r(),.55);
  const nb=[Math.sin(ph)*Math.cos(th)*260*rr,Math.cos(ph)*420*rr,Math.sin(ph)*Math.sin(th)*260*rr];
  let st;
  if(r()<.74){let q=r()*segTot,k=0;while(k<SEG.length-1&&q>segLen[k]){q-=segLen[k];k++}const s=SEG[k],u=q/segLen[k];st=[lerp(s[0],s[2],u),lerp(s[1],s[3],u),s[4]]}
  else{let q=r()*fillTot,k=0;while(k<FILL.length-1&&q>fillA[k]){q-=fillA[k];k++}const f=FILL[k];st=[lerp(f[0],f[2],r()),lerp(f[1],f[3],r()),f[4]]}
  const ringR=[110,190,270,340][r()<.15?0:r()<.3?1:r()<.55?2:3];
  const ld=norm([r()-.35,r()-.5,r()-.5]);
  M.push({nb,w:.12+r()*.25,ph:r()*6.28,leak:r()<.16,lv:mul(ld,300+r()*700),
    dp:[NEB[0]+(r()-.5)*1900,(r()-.5)*1300-60,1750+r()*2600],
    st,ringR,ra:r()*6.283,rsp:(.1+r()*.12)*(r()<.5?1:-1),rj:(r()-.5)*14,
    d:r(),sz:.8+r()*1.5,col:r()<.55?0:r()<.7?1:2,a:.45+r()*.4});
}
for(let i=0;i<ND;i++)D.push({b:[r()*5000,r()*3200,r()*7000],sz:.5+r()*1.3,col:r()<.12?3:r()<.6?0:2,a:.25+r()*.5,tw:r()*6.28});
}
// клиенты, летящие в кнопку «заявка»
const CL=[];{const r=rng(31);for(let j=0;j<60;j++){const a=r()*6.283,rad=900+r()*700;
  const s=[SITE[0]+Math.cos(a)*rad*1.2,SITE[1]+Math.sin(a)*rad*.7,SITE[2]-150+r()*500];
  CL.push({s,c:add(L3(s,BTN,.45),[(r()-.5)*500,(r()-.5)*400,-200]),ta:11.95+j/60*1.45+r()*.05})}}

function mainPos(p,t,camDelta){
  const a=p.w*t+p.ph,c=Math.cos(a),s=Math.sin(a);
  let P=[NEB[0]+p.nb[0]*c-p.nb[2]*s,NEB[1]+p.nb[1]+Math.sin(t*.7+p.ph)*8,NEB[2]+p.nb[0]*s+p.nb[2]*c];
  if(p.leak)P=add(P,mul(p.lv,sm(.9,4.4,t)));
  const k1=eio((t-4.3-p.d*.35)/.9);
  if(k1>0){const dp=add(p.dp,[Math.sin(t*.4+p.ph)*30,Math.cos(t*.33+p.ph)*24,0]);P=L3(P,add(dp,camDelta),k1)}
  const k2=eo((t-9.75-p.d*.9)/1.35);
  if(k2>0){const S=[SITE[0]+p.st[0],SITE[1]+p.st[1]+Math.sin(t*2+p.ph)*1.5,SITE[2]+p.st[2]];P=L3(P,S,k2)}
  const k3=eio((t-13.15-p.d*.45)/.75);
  if(k3>0){const ang=p.ra+p.rsp*t,x=Math.cos(ang)*p.ringR,y=Math.sin(ang)*p.ringR;
    P=L3(P,[SITE[0]+x,SITE[1]+y*Math.cos(TILT),SITE[2]-y*Math.sin(TILT)+p.rj],k3)}
  const k4=t-16.3;
  if(k4>0){const e=eo(k4/1.1);P=add(SITE,add(mul(sub(P,SITE),1+e*3.2),[0,0,e*900*(p.d-.3)]))}
  return P;
}
function mainAlpha(p,t){return p.a*(1-sm(16.5,17.25,t))*sm(0,.6,t)}

/* ---------- текст ---------- */
function T(s,x,y,size,o={}){
  ctx.save();ctx.globalAlpha=clamp(o.a??1);if(ctx.globalAlpha<=0.003){ctx.restore();return 0}
  ctx.font=`${o.w||500} ${size}px ${o.mono?MONO:SANS}`;ctx.fillStyle=o.c||'#f4efe8';
  ctx.letterSpacing=(o.ls??(o.mono?2:-size*.025))+'px';ctx.textAlign=o.al||'left';
  if((o.blur||0)>.35)ctx.filter=`blur(${o.blur.toFixed(1)}px)`;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb||24}
  ctx.fillText(s,x,y);const w=ctx.measureText(s).width;ctx.restore();return w;
}
function measure(s,size,o={}){ctx.save();ctx.font=`${o.w||500} ${size}px ${o.mono?MONO:SANS}`;ctx.letterSpacing=(o.ls??(o.mono?2:-size*.025))+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
// слова появляются из размытия с подъёмом
function words(list,x,y,size,t,t0,st,o={}){
  let cx=x;const sp=size*.26;
  list.forEach((wd,i)=>{const s=typeof wd==='string'?wd:wd[0],col=typeof wd==='string'?o.c:wd[1];
    const k=(t-t0-i*st)/.5,e=eo5(k);
    T(s,cx+(1-e)*-14,y+(1-e)*size*.38,size,{...o,c:col,a:(o.a??1)*eo(k),blur:(1-e)*14+(o.blur||0),glow:col===ORANGE||col===GOLD?'rgba(255,120,30,.55)':o.glow});
    cx+=measure(s,size,o)+sp;});
}
const GL='#$%&@01ABCDXZ░▒<>/\\|*+=АБВГДЖЗИКЛМНП';
function scramble(s,k,seed){const n=s.length,rv=Math.floor(clamp(k)*n);let o='';
  for(let i=0;i<n;i++){if(i<rv||s[i]===' ')o+=s[i];else o+=GL[(Math.floor(seed*997+i*31))%GL.length]}return o}
function brackets(x,y,r,a,col=GOLD,len=10){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.beginPath();
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.moveTo(x+sx*r,y+sy*(r-len));ctx.lineTo(x+sx*r,y+sy*r);ctx.lineTo(x+sx*(r-len),y+sy*r)}ctx.stroke();ctx.restore()}
function chapter(t,num,label,t0,t1){
  const a=sm(t0,t0+.4,t)*(1-sm(t1-.3,t1,t));if(a<=0)return;
  T(num+' — '+label,120,118,16,{mono:1,c:GOLD,a:a*.9,ls:3,w:500});
  ctx.save();ctx.globalAlpha=a*.35;ctx.fillStyle='#fff';ctx.fillRect(120,134,lerp(0,180,eo((t-t0)/.8)),1);ctx.restore();
  T(num+' / 06',W-120,118,16,{mono:1,c:'#8d857a',a:a*.8,al:'right',ls:3});
}

/* ---------- кадр ---------- */
function renderAt(t){
  const cam=camAt(t),camP=camAt(t-SH);
  const c845=camAt(Math.min(t,8.45)),c845p=camAt(Math.min(t-SH,8.45));
  const camDelta=t>8.45?sub(cam.pos,c845.pos):[0,0,0],camDeltaP=t-SH>8.45?sub(camP.pos,c845p.pos):[0,0,0];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';
  // фон
  ctx.fillStyle='#050407';ctx.fillRect(0,0,W,H);
  const nebP=proj(NEB,cam);
  if(nebP&&t<4.9){const g=ctx.createRadialGradient(nebP.x,nebP.y,0,nebP.x,nebP.y,700*nebP.s+200);
    g.addColorStop(0,`rgba(255,120,30,${.16*(1-sm(4.3,4.9,t))})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const siteP=proj(SITE,cam);
  if(siteP&&t>10&&t<16.6){const g=ctx.createRadialGradient(siteP.x,siteP.y,0,siteP.x,siteP.y,800*siteP.s);
    g.addColorStop(0,`rgba(255,110,20,${.12*sm(10.5,12,t)*(1-sm(16,16.6,t))})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const fd=focusAt(t);
  ctx.globalCompositeOperation='lighter';
  // пыль (бесконечное поле вокруг камеры)
  const SX=5000,SY=3200,SZ=7000;
  for(const p of D){
    const P=[cam.pos[0]+fmod(p.b[0]-cam.pos[0],SX)-SX/2,cam.pos[1]+fmod(p.b[1]-cam.pos[1],SY)-SY/2,cam.pos[2]+fmod(p.b[2]-cam.pos[2],SZ)-300];
    const zr=P[2]-cam.pos[2];const fade=sm(-200,500,zr)*(1-sm(SZ-1600,SZ-400,zr));
    const a=p.a*fade*(.75+.25*Math.sin(t*2+p.tw))*(t>20.5?.7:1);
    drawP(P,P,cam,camP,p.sz,p.col,a,fd,.75);
  }
  // основные частицы
  for(const p of M){const a=mainAlpha(p,t);if(a<=.01)continue;
    const nb=1+.6*(1-sm(4.2,4.8,t));drawP(mainPos(p,t,camDelta),mainPos(p,t-SH,camDeltaP),cam,camP,p.sz*nb,p.col,Math.min(1,a*nb),fd,1)}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  scene1(t,cam);scene2(t,cam);scene3(t,cam,camP,fd);scene4(t,cam);scene5MB(t);scene6(t-1); // финал сдвинут на +1 с ради 4-го блока

  // пост: радиальный zoom-blur на переходах
  const zb=.16*bump(4.25,4.6,5.0,t)+.11*bump(8.38,8.55,8.95,t)+.035*bump(8.9,9.6,10.5,t)+.12*bump(16.25,16.55,16.95,t)+.06*bump(20.6,20.76,21.05,t);
  if(zb>.004)zoomBlur(zb);
  if(t>7.78&&t<8.48)glitch(t);
  // виньетка + зерно
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.055;ctx.globalCompositeOperation='overlay';

const LY=document.createElement('canvas');LY.width=W;LY.height=H;const lctx=LY.getContext('2d');
// въезд к блоку 01 такой же, как к остальным: камера приходит слева на линию и переезжает к блоку
function panX5(t){return SITE[0]-RSP+RSP*eio((t-16.63)/.36)+RSP*eio((t-17.38)/.36)+RSP*eio((t-18.13)/.36)+RSP*eio((t-18.88)/.36)+(t-17)*30}
function progX5(t){return SITE[0]-RSP-900*(1-eo((t-16.45)/.3))+RSP*eio((t-16.63)/.36)+RSP*eio((t-17.38)/.36)+RSP*eio((t-18.13)/.36)+RSP*eio((t-18.88)/.36)}
function lineW(a,b,col,al,w,dash){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function scene5(t,cam){
  if(t<16.5||t>20.8)return;
  const col=sm(20.25,20.7,t),A=sm(16.55,16.9,t)*(1-col);
  const hits=RES.filter(n=>t>=n.hit).length;
  // шапка: «— РЕЗУЛЬТАТ» и счётчик с полосками
  if(A>0){
    ctx.save();ctx.globalAlpha=A;ctx.fillStyle=ORANGE;ctx.fillRect(120,111,lerp(0,30,eo((t-16.6)/.5)),2);ctx.restore();
    T('РЕЗУЛЬТАТ',166,118,16,{mono:1,c:GOLD,a:A,ls:3});
    T(`0${Math.max(1,hits)} / 04`,W-420,118,16,{mono:1,c:'#b9ad9c',a:A,al:'right',ls:3});
    for(let j=0;j<4;j++){const f=j<hits?eo((t-RES[j].hit)/.3):0;ctx.save();ctx.globalAlpha=A*.35;ctx.fillStyle='#8d857a';ctx.fillRect(W-390+j*70,112,60,2);
      ctx.globalAlpha=A;ctx.fillStyle=ORANGE;ctx.fillRect(W-390+j*70,111,60*f,3);ctx.restore()}
  }

  RES.forEach((nd,k)=>{const q=proj(RW(k),cam);if(!q||q.x<-500||q.x>W+500||AL<=0)return;
    const on=t>=nd.hit,ka=t-nd.hit,cur=on&&k===hits-1,s=q.s,R=150*s,a=AL;

    if(cur){const g=ctx.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,`rgba(255,110,20,${.26*a})`);g.addColorStop(1,'rgba(255,110,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.fill()}
    ctx.globalAlpha=a;ctx.fillStyle='rgba(5,4,7,.85)';ctx.beginPath();ctx.arc(0,0,R-1,0,6.283);ctx.fill();

    ctx.strokeStyle=on?'#5a3a22':'#6f655a';ctx.lineWidth=1.5;ctx.globalAlpha=a*dim;ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.stroke();
    if(on){const g=eo(ka/.6);ctx.strokeStyle=ORANGE;ctx.lineWidth=cur?3:2;ctx.globalAlpha=a*dim;if(cur){ctx.shadowColor='rgba(255,110,20,.9)';ctx.shadowBlur=18}
      ctx.beginPath();ctx.arc(0,0,R,-1.571,-1.571+6.283*g);ctx.stroke();ctx.shadowBlur=0;
      const e=eo(ka/.35);ctx.lineWidth=1.4;ctx.globalAlpha=a*(cur?.6:.3);ctx.beginPath();ctx.arc(0,0,lerp(R,R*1.17,e),0,6.283);ctx.stroke();
      if(cur){ctx.strokeStyle='#b9ad9c';ctx.globalAlpha=a*.3*e;ctx.beginPath();ctx.arc(0,0,R*1.08,0,6.283);ctx.stroke()}
      const pk=clamp(ka/.55);if(pk<1){ctx.strokeStyle=GOLD;ctx.globalAlpha=a*(1-pk)*.8;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R*(1+eo(pk)*.8),0,6.283);ctx.stroke()}}
    // деления шкалы
    ctx.strokeStyle=on?GOLD:'#5d554c';ctx.lineWidth=1.2;ctx.globalAlpha=a*(on?.5:.3);ctx.beginPath();
    for(let i=0;i<40;i++){const an=i/40*6.283,r1=R*.86,r2=R*(i%5?.9:.93);ctx.moveTo(Math.cos(an)*r1,Math.sin(an)*r1);ctx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2)}ctx.stroke();

    const v=!on?nd.v.replace(/./g,'0'):sk<1?nd.v.replace(/./g,(c,i)=>String((seed*7+i*3)%10)):nd.v;
    const vs=(nd.v.length>2?104:140)*s,vc=on?'#f4efe8':'#4f483f',va=a*(on?1:.8);
    const wPre=nd.pre?measure(nd.pre,vs*.55,{w:400})+6*s:0,wV=measure(v,vs,{w:600}),wS=nd.suf==='ДНЕЙ'?0:measure(nd.suf,vs*.62,{w:500});
    let x0=q.x-(wPre+wV+wS)/2,yb=q.y+vs*.36-(nd.suf==='ДНЕЙ'?14*s:0);

    T(v,x0+wPre,yb,vs,{w:600,c:vc,a:va,blur:on&&sk<1?1.2:0,glow:cur&&sk>=1&&sk<1.6?'rgba(255,140,40,.8)':null,gb:30});
    if(wS)T(nd.suf,x0+wPre+wV+4*s,yb,vs*.62,{w:500,c:on?GOLD:'#4f483f',a:va});
    else T('ДНЕЙ',q.x,yb+40*s,20*s,{mono:1,w:700,c:on?GOLD:'#4f483f',a:va,al:'center',ls:4});

    // подпись (+ «двоение» при переключении, как в референсе)

    T(nd.tx,q.x,ty,ts,{w:500,al:'center',c:on?'#f4efe8':'#5f574e',a:a*(on?(cur?1:.7):.85),glow:cur?'rgba(255,255,255,.35)':null,gb:22,blur:on&&ka<.2?(1-ka/.2)*4:0});
    if(on)T(scramble(nd.sub,(ka-.05)/.4,Math.floor(t*30)+k*5),q.x,q.y+326*s,17,{mono:1,c:GOLD,a:a*(cur?.9:.5)*eo(ka/.15),al:'center',ls:3});
  });

    for(let i=0;i<140;i++){const a0=r()*6.283,d0=200+r()*700,e=eio(clamp((t-20.25-r()*.15)/.45));const dd=d0*(1-e);
      const x=W/2+Math.cos(a0)*dd,y=H/2+Math.sin(a0)*dd*.6,x0=W/2+Math.cos(a0)*(dd+60*e),y0=H/2+Math.sin(a0)*(dd+60*e)*.6;
      ctx.globalAlpha=.7*Math.sin(e*3.14);ctx.strokeStyle=GOLD;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke()}
    ctx.globalAlpha=col;ctx.drawImage(SPR[2][1],W/2-60*col,H/2-60*col,120*col,120*col);ctx.restore()}
}
// motion blur на резком переезде камеры: несколько подкадров
function scene5MB(t){
  if(t<16.5||t>20.8)return;
  const n=Math.abs(panX5(t)-panX5(t-1/60))>5?10:1;
  if(n===1){scene5(t,camAt(t));return}
  const m=ctx;m.save();m.globalCompositeOperation='lighter';
  for(let j=0;j<n;j++){const tj=t-SH*j/(n-1);lctx.setTransform(1,0,0,1,0,0);lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.filter='none';lctx.clearRect(0,0,W,H);
    ctx=lctx;scene5(tj,camAt(tj));ctx=m;m.globalAlpha=1/n;m.drawImage(LY,0,0)}
  m.restore();

/* ---------- СЦЕНА 6 · Финал 19.5–22 ---------- */
function scene6(t){
  if(t<19.68)return;
  const k=t-19.74,dr=1+(t-19.74)*.012;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(dr,dr);ctx.translate(-W/2,-H/2);
  // вспышка/лучи
  ctx.save();ctx.globalCompositeOperation='lighter';
  const rk=clamp(k/.75);if(k>0&&rk<1){const r=rng(5);
    for(let i=0;i<64;i++){const an=i/64*6.283+r()*.05,r1=60+eo(rk)*220*(.6+r()),r2=r1+40+r()*140*(1-rk);
      ctx.globalAlpha=(1-rk)*.8;ctx.strokeStyle=r()<.5?GOLD:'#ffe0b0';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(W/2+Math.cos(an)*r1,H/2-60+Math.sin(an)*r1);ctx.lineTo(W/2+Math.cos(an)*r2,H/2-60+Math.sin(an)*r2);ctx.stroke()}
    const hl=eo5(rk)*W*.55,lg=ctx.createLinearGradient(W/2-hl,0,W/2+hl,0);lg.addColorStop(0,'rgba(255,122,26,0)');lg.addColorStop(.5,'rgba(255,200,130,1)');lg.addColorStop(1,'rgba(255,122,26,0)');
    ctx.globalAlpha=(1-rk)*.9;ctx.fillStyle=lg;ctx.fillRect(W/2-hl,H/2-61,hl*2,2)}
  ctx.restore();
  // ---- заголовок «Бизнесу нужен сайт.»: буквы поднимаются из линии света, «сайт.» вспыхивает оранжевым ----
  const by=H/2-60,HS=V?92:116,HL='Бизнесу нужен сайт.',OR=14,IGN=20.35;
  const hw=measure(HL,HS,{w:600}),hx=W/2-hw/2,hy=by+38,ly=hy+34;
  // линия света: сначала яркая щель, из которой выходит текст, потом остаётся подчёркиванием
  const uk=eo5((t-19.76)/.35);
  if(uk>0){ctx.save();ctx.globalCompositeOperation='lighter';const L=hw/2*uk+120*(1-uk);
    const ug=ctx.createLinearGradient(W/2-L,0,W/2+L,0);ug.addColorStop(0,'rgba(255,122,26,0)');ug.addColorStop(.5,'rgba(255,200,140,1)');ug.addColorStop(1,'rgba(255,122,26,0)');
    const hot=1-sm(19.9,20.6,t);ctx.fillStyle=ug;ctx.globalAlpha=.55+.45*hot;ctx.shadowColor='rgba(255,120,30,.9)';ctx.shadowBlur=14+30*hot;
    ctx.fillRect(W/2-L,ly,L*2,2);if(hot>0){ctx.globalAlpha=hot*.35;ctx.fillRect(W/2-L*.8,ly-6,L*1.6,14)}ctx.restore()}
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,ly);ctx.clip();       // маска: буквы видны только над линией
  for(let i=0;i<HL.length;i++){const ch=HL[i];if(ch===' ')continue;
    const fx=hx+measure(HL.slice(0,i),HS,{w:600}),cw=measure(ch,HS,{w:600}),st=19.8+i*.028;
    const lk=clamp((t-st)/.42);if(lk<=0)continue;

    const col=org?`rgb(${Math.round(lerp(244,255,ig))},${Math.round(lerp(239,122,ig))},${Math.round(lerp(232,26,ig))})`:'#f4efe8';
    const draw=(kk,al,bl)=>{const e=back(kk),y=hy+(1-e)*HS*1.05,rot=(1-eo(kk))*.22;
      ctx.save();ctx.translate(fx+cw/2,y);ctx.rotate(rot);ctx.scale(1,1+(1-eo(kk))*.25);
      T(ch,-cw/2,0,HS,{w:600,c:col,a:al,blur:bl,glow:ig>0?`rgba(255,110,20,${.75*ig})`:null,gb:36+30*bump(0,.3,1,ig)});ctx.restore()};
    if(lk<1)for(let j=3;j>=1;j--)draw(clamp(lk-j*.07),.2*(1-j/4),3+j*3);   // вертикальный шлейф движения

    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,246,230,.75)');sg.addColorStop(1,'rgba(255,255,255,0)');

  { const sp=SS*.28,ws=SUB.map(w=>measure(w,SS,{w:400,ls:0})),tot=ws.reduce((a,b)=>a+b,0)+sp*(SUB.length-1);let cx=W/2-tot/2;
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,sy+12);ctx.clip();
    SUB.forEach((w,i)=>{const k=clamp((t-20.28-i*.07)/.45),e=back(k);

    ctx.restore();}

  const ck=t-20.5;

    ctx.beginPath();ctx.roundRect(px,py,pw,ph,35);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(170,225,255,.9)';ctx.lineWidth=1.5;ctx.stroke();

    const pk=clamp((ck-.4)/.7);if(pk>0&&pk<1){ctx.save();ctx.globalAlpha=(1-pk)*.7;ctx.strokeStyle='#7fd0ff';ctx.lineWidth=2;const g=eo(pk)*22;
      ctx.beginPath();ctx.roundRect(W/2-pw0/2-g,py-g,pw0+2*g,ph+2*g,35+g);ctx.stroke();ctx.restore()}
    const s1='Пиши в Telegram: ',s2='@votsuev',w1=measure(s1,30,{w:500}),w2=measure(s2,30,{w:700}),tw=36+w1+10+w2,sx=W/2-tw/2;
    ctx.save();ctx.beginPath();ctx.roundRect(px,py,pw,ph,35);ctx.clip();

    T(s1,sx+36,ty,30,{w:500,a:eo(tk*1.5),c:'#ffffff',ls:0,blur:(1-eo(tk))*5});
    const tk2=clamp((ck-.24)/.36),ty2=py+ph/2+11+(1-back(tk2))*ph;
    T(s2,sx+46+w1,ty2,30,{w:700,a:eo(tk2*1.5),c:'#ffffff',ls:0,blur:(1-eo(tk2))*5});
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- превью в браузере ---------- */
window.renderAt=renderAt;
if(!location.search.includes('render')){
  let playing=true,t0=performance.now(),off=0;
  const au=new Audio('votsuev-promo.wav');
  cv.onclick=()=>{playing=!playing;if(playing){t0=performance.now();au.currentTime=off;au.play().catch(()=>{})}else{off=cur();au.pause()}};
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){off=clamp(cur()+(e.key==='ArrowRight'?1:-1),0,DUR-.01);t0=performance.now();au.currentTime=off}});
  const cur=()=>playing?(off+(performance.now()-t0)/1000)%DUR:off;
  (function loop(){renderAt(cur());requestAnimationFrame(loop)})();
}
