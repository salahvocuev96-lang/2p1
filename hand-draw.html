<title>Hand Draw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-screen camera with floating toolbar */
  :root {
    --bg: #0d0f10;
    --surface: rgba(18, 22, 26, 0.85);
    --border: rgba(255,255,255,0.1);
    --fg: #e8eaed;
    --fg-muted: #8b949e;
    --accent: #3fb950;
    --accent-glow: rgba(63, 185, 80, 0.35);
    --danger: #f85149;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #c-video { z-index: 1; }
  #c-draw  { z-index: 2; pointer-events: none; }
  #c-ui    { z-index: 3; pointer-events: none; }

  video {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }

  /* ── Toolbar ──────────────────────────────────────────── */
  #toolbar {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 16px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    white-space: nowrap;
  }

  .sep {
    width: 1px; height: 24px;
    background: var(--border);
    flex-shrink: 0;
  }

  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .color-swatch input[type=color] {
    position: absolute;
    inset: -4px;
    opacity: 0;
    cursor: pointer;
    width: 200%;
    height: 200%;
  }

  .size-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .size-btn:hover, .size-btn.active {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
  }

  .clear-btn {
    background: rgba(248, 81, 73, 0.15);
    border: 1px solid rgba(248, 81, 73, 0.35);
    color: var(--danger);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .clear-btn:hover { background: rgba(248, 81, 73, 0.28); }

  .cam-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .cam-btn:hover { background: rgba(255,255,255,0.15); color: var(--fg); }

  #cam-select {
    position: fixed;
    top: max(60px, calc(env(safe-area-inset-top, 0px) + 54px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 240px;
    max-width: calc(100vw - 32px);
  }
  #cam-select.open { display: flex; }
  .cam-option {
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--fg);
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .cam-option:hover { background: rgba(255,255,255,0.1); }
  .cam-option.active { border-color: var(--accent); color: var(--accent); }

  /* ── Status banner ────────────────────────────────────── */
  #status {
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 7px 18px;
    font-size: 14px;
    color: var(--fg-muted);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    pointer-events: none;
    transition: color 0.2s;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  #status.drawing {
    color: var(--accent);
    border-color: rgba(63, 185, 80, 0.4);
  }

  /* ── Help overlay ─────────────────────────────────────── */
  #help {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 12px;
    pointer-events: none;
  }
  .hint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--fg-muted);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    text-align: center;
    line-height: 1.5;
    white-space: nowrap;
  }
  .hint strong { color: var(--fg); display: block; font-size: 16px; margin-bottom: 2px; }
</style>

<div id="stage">
  <canvas id="c-video"></canvas>
  <canvas id="c-draw"></canvas>
  <canvas id="c-ui"></canvas>
  <video id="video" playsinline muted autoplay></video>
</div>

<div id="status">⏳ Загрузка MediaPipe…</div>

<div id="help">
  <div class="hint"><strong>✋</strong>Слежение</div>
  <div class="hint"><strong>☝️</strong>Рисование</div>
  <div class="hint"><strong>✌️</strong>Стереть</div>
</div>

<div id="cam-select"></div>

<div id="toolbar">
  <button class="cam-btn" id="camBtn">📷 Камера</button>
  <div class="sep"></div>
  <label class="color-swatch" id="swatchBox" title="Цвет">
    <input type="color" id="colorPicker" value="#3fb950">
  </label>
  <div class="sep"></div>
  <button class="size-btn active" data-size="4" title="Тонкая">S</button>
  <button class="size-btn" data-size="10" title="Средняя">M</button>
  <button class="size-btn" data-size="22" title="Толстая">L</button>
  <div class="sep"></div>
  <button class="clear-btn" id="clearBtn">✕ Очистить</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>

<script>
const video    = document.getElementById('video');
const cVideo   = document.getElementById('c-video');
const cDraw    = document.getElementById('c-draw');
const cUi      = document.getElementById('c-ui');
const ctxVideo = cVideo.getContext('2d');
const ctxDraw  = cDraw.getContext('2d');
const ctxUi    = cUi.getContext('2d');
const statusEl = document.getElementById('status');
const colorPicker = document.getElementById('colorPicker');
const swatchBox   = document.getElementById('swatchBox');

let W = 0, H = 0;
let brushSize = 4;
let brushColor = '#3fb950';
let lastX = null, lastY = null;
let wasDrawing = false;
let eraserMode = false;

/* ── Resize ──────────────────────────────────────────────── */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  [cVideo, cDraw, cUi].forEach(c => { c.width = W; c.height = H; });
}
resize();
window.addEventListener('resize', () => { resize(); ctxDraw.clearRect(0,0,W,H); });

/* ── UI controls ─────────────────────────────────────────── */
colorPicker.addEventListener('input', e => {
  brushColor = e.target.value;
  swatchBox.style.background = brushColor;
});
swatchBox.style.background = brushColor;

document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushSize = parseInt(btn.dataset.size);
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  ctxDraw.clearRect(0, 0, W, H);
});

/* ── Hand gesture helpers ────────────────────────────────── */
function fingerUp(lm, tip, pip) {
  return lm[tip].y < lm[pip].y;
}

// ☝️ Index only up → draw
function isDrawGesture(lm) {
  return  fingerUp(lm, 8, 6) &&
         !fingerUp(lm,12,10) &&
         !fingerUp(lm,16,14) &&
         !fingerUp(lm,20,18);
}

// ✌️ Index + middle up → erase
function isEraseGesture(lm) {
  return  fingerUp(lm, 8, 6) &&
          fingerUp(lm,12,10) &&
         !fingerUp(lm,16,14) &&
         !fingerUp(lm,20,18);
}

/* ── Draw cursor on UI canvas ────────────────────────────── */
function drawCursor(x, y, mode) {
  ctxUi.clearRect(0, 0, W, H);
  const r = mode === 'draw' ? brushSize * 0.8 + 4
          : mode === 'erase' ? 18
          : 10;
  const color = mode === 'draw'  ? brushColor
              : mode === 'erase' ? '#f85149'
              : 'rgba(255,255,255,0.7)';

  ctxUi.beginPath();
  ctxUi.arc(x, y, r, 0, Math.PI * 2);
  ctxUi.strokeStyle = color;
  ctxUi.lineWidth = 2;
  ctxUi.stroke();

  if (mode === 'draw') {
    ctxUi.beginPath();
    ctxUi.arc(x, y, brushSize * 0.4, 0, Math.PI * 2);
    ctxUi.fillStyle = brushColor;
    ctxUi.fill();
  }
}

/* ── MediaPipe ───────────────────────────────────────────── */
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  // Draw mirrored video
  ctxVideo.clearRect(0, 0, W, H);
  ctxVideo.save();
  ctxVideo.translate(W, 0);
  ctxVideo.scale(-1, 1);
  ctxVideo.drawImage(results.image, 0, 0, W, H);
  ctxVideo.restore();

  if (!results.multiHandLandmarks?.length) {
    ctxUi.clearRect(0, 0, W, H);
    statusEl.textContent = '👋 Покажи руку перед камерой';
    statusEl.className = '';
    lastX = null; lastY = null; wasDrawing = false;
    return;
  }

  const lm = results.multiHandLandmarks[0];

  // Skeleton (mirrored)
  ctxVideo.save();
  ctxVideo.translate(W, 0);
  ctxVideo.scale(-1, 1);
  drawConnectors(ctxVideo, lm, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.3)', lineWidth: 1.5 });
  drawLandmarks(ctxVideo, lm, { color: '#3fb950', radius: 3, lineWidth: 0 });
  ctxVideo.restore();

  // Index finger tip → mirrored x
  const tip = lm[8];
  const x = (1 - tip.x) * W;
  const y = tip.y * H;

  const isDraw  = isDrawGesture(lm);
  const isErase = isEraseGesture(lm);
  const mode    = isDraw ? 'draw' : isErase ? 'erase' : 'move';

  drawCursor(x, y, mode);

  if (isDraw) {
    statusEl.textContent = '✏️ Рисуй! (укажи вверх)';
    statusEl.className = 'drawing';

    if (lastX !== null && wasDrawing) {
      ctxDraw.beginPath();
      ctxDraw.strokeStyle = brushColor;
      ctxDraw.lineWidth = brushSize;
      ctxDraw.lineCap = 'round';
      ctxDraw.lineJoin = 'round';
      ctxDraw.moveTo(lastX, lastY);
      ctxDraw.lineTo(x, y);
      ctxDraw.stroke();
    }
    lastX = x; lastY = y;
    wasDrawing = true;

  } else if (isErase) {
    statusEl.textContent = '🧹 Ластик активен';
    statusEl.className = '';

    if (lastX !== null && wasDrawing) {
      ctxDraw.save();
      ctxDraw.globalCompositeOperation = 'destination-out';
      ctxDraw.beginPath();
      ctxDraw.arc(x, y, 18, 0, Math.PI * 2);
      ctxDraw.fill();
      ctxDraw.restore();
    }
    lastX = x; lastY = y;
    wasDrawing = true;

  } else {
    statusEl.textContent = '☝️ Подними указательный — рисование, ✌️ два пальца — ластик';
    statusEl.className = '';
    lastX = null; lastY = null; wasDrawing = false;
  }
});

/* ── Camera selection ────────────────────────────────────── */
let currentDeviceId = null;
let camInstance = null;
const camBtn    = document.getElementById('camBtn');
const camSelect = document.getElementById('cam-select');

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d => d.kind === 'videoinput');
  } catch { return []; }
}

async function startCamera(deviceId) {
  if (camInstance) { camInstance.stop(); camInstance = null; }
  currentDeviceId = deviceId || null;

  const constraints = deviceId
    ? { deviceId: { exact: deviceId } }
    : { facingMode: 'user' };

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: constraints });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    statusEl.textContent = `❌ Ошибка камеры: ${e.message}`;
    return;
  }

  camInstance = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 1280, height: 720
  });
  camInstance.start()
    .then(() => { statusEl.textContent = '✋ Покажи руку перед камерой'; })
    .catch(err => { statusEl.textContent = `❌ ${err.message}`; });
}

async function renderCamList() {
  const cameras = await listCameras();
  camSelect.innerHTML = '';
  if (!cameras.length) {
    camSelect.innerHTML = '<div class="cam-option">Камеры не найдены</div>';
    return;
  }
  cameras.forEach((cam, i) => {
    const label = cam.label || `Камера ${i + 1}`;
    const el = document.createElement('div');
    el.className = 'cam-option' + (cam.deviceId === currentDeviceId ? ' active' : '');
    el.textContent = label;
    el.onclick = () => {
      camSelect.classList.remove('open');
      startCamera(cam.deviceId);
    };
    camSelect.appendChild(el);
  });
}

camBtn.addEventListener('click', async () => {
  if (camSelect.classList.contains('open')) {
    camSelect.classList.remove('open');
  } else {
    await renderCamList();
    camSelect.classList.add('open');
  }
});

document.addEventListener('click', e => {
  if (!camSelect.contains(e.target) && e.target !== camBtn)
    camSelect.classList.remove('open');
});

/* ── Start default camera ────────────────────────────────── */
startCamera(null);
</script>
