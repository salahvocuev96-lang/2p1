<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>НК — BUILD: КАРЬЕРА</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:#020617;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="qr.js"></script>
<script>
'use strict';
// ============================================================
//  НК · BUILD: КАРЬЕРА — детерминированный таймлайн, render(t)
// ============================================================
const W = 1920, H = 1080, DUR = 70;
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
const bloomC = document.createElement('canvas'); bloomC.width = W / 4; bloomC.height = H / 4;
const bctx = bloomC.getContext('2d');

const C = {
  bg0: '#01040F', bg1: '#04102E', navy: '#0A2470', royal: '#1E3FD8', blue: '#2F5BFF',
  sky: '#5B8CFF', ice: '#A9C6FF', cyan: '#62E4FF', white: '#F2F7FF'
};
const FD = '"Unbounded", "Inter", sans-serif';
const FM = '"JetBrains Mono", monospace';
const FI = '"Inter", sans-serif';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = t => 1 - Math.pow(1 - t, 3);
const eInC = t => t * t * t;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutX = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eInX = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
const eIOX = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const eBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const spring = (t, f = 4.5, d = 5) => t <= 0 ? 0 : 1 - Math.exp(-d * t) * Math.cos(f * Math.PI * t);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const BEAT = 0.5;

// ---------- scenes table ----------
const S = { term: [0, 4], logo: [4, 8], hook: [8, 14], code: [14, 22], prac: [22, 28], fns: [28, 36], dip: [36, 42], team: [42, 52], build: [52, 60], cta: [60, 67], pack: [67, 70] };

// ---------- audio events (single source of truth for sound) ----------
const EV = [];
const ev = (t, type, v = 1) => EV.push({ t: +t.toFixed(4), type, v });

// ---------- terminal typing schedule ----------
const CMD = '> init career --college="НК"';
const TYPE_T = []; { const r = rng(7); let t = 0.55; for (let i = 0; i < CMD.length; i++) { TYPE_T.push(t); if (i > 1) ev(t, 'key', 0.6 + r() * 0.4); t += 0.055 + r() * 0.05 + (CMD[i] === ' ' ? 0.06 : 0); } }
const ENTER_T = 3.55; ev(ENTER_T, 'enter');
ev(2.0, 'riser1');
const CMD2 = '> run future';
const TYPE2 = []; { const r = rng(9); let t = 60.15; for (let i = 0; i < CMD2.length; i++) { TYPE2.push(t); if (i > 1) ev(t, 'key', 0.7 + r() * 0.3); t += 0.045 + r() * 0.03; } }

// ============================================================
//  LOGO geometry (traced from official mark; 1000×720 box)
// ============================================================
const LOGO_H = [[38, 58], [200, 58], [200, 300], [405, 300], [405, 58], [568, 58], [568, 240], [405, 435], [200, 435], [200, 685], [38, 685]];
const LOGO_K = [[405, 520], [790, 58], [955, 58], [740, 325], [965, 685], [790, 685], [625, 455], [568, 520], [568, 685], [405, 685]];
const LCX = 501, LCY = 371;
function logoPath(c, poly, s, ox = 0, oy = 0) {
  c.moveTo((poly[0][0] - LCX) * s + ox, (poly[0][1] - LCY) * s + oy);
  for (let i = 1; i < poly.length; i++) c.lineTo((poly[i][0] - LCX) * s + ox, (poly[i][1] - LCY) * s + oy);
  c.closePath();
}
// sample points inside the logo for particle assembly
const LOGO_PTS = (() => {
  const oc = document.createElement('canvas'); oc.width = 500; oc.height = 360; const o = oc.getContext('2d');
  o.fillStyle = '#fff'; o.beginPath(); logoPath(o, LOGO_H, 0.5, 250, 180); logoPath(o, LOGO_K, 0.5, 250, 180); o.fill();
  const d = o.getImageData(0, 0, 500, 360).data; const pts = [];
  for (let y = 0; y < 360; y += 7) for (let x = 0; x < 500; x += 7) if (d[(y * 500 + x) * 4 + 3] > 128) pts.push([(x - 250) * 2, (y - 180) * 2]);
  return pts;
})();

// rich logo renderer: extrusion + gradient face + rim + shine
function drawLogo(c, cx, cy, size, o = {}) {
  const s = size / 1000;
  const a = o.alpha ?? 1; if (a <= 0) return;
  const depth = o.depth ?? 18, dx = o.dx ?? 0.55, dy = o.dy ?? 0.85;
  c.save(); c.globalAlpha = a; c.translate(cx, cy);
  if (o.rot) c.rotate(o.rot);
  if (o.sx !== undefined) c.scale(o.sx, 1);
  // glow
  if (o.glow) { c.save(); c.shadowColor = 'rgba(70,140,255,0.9)'; c.shadowBlur = 60 * o.glow * s * 3; c.fillStyle = 'rgba(30,70,220,0.6)'; c.beginPath(); logoPath(c, LOGO_H, s); logoPath(c, LOGO_K, s); c.fill(); c.restore(); }
  // extrusion
  for (let i = depth; i > 0; i--) {
    const k = i / depth;
    c.fillStyle = `rgb(${lerp(10, 4, k) | 0},${lerp(30, 12, k) | 0},${lerp(110, 50, k) | 0})`;
    c.beginPath(); logoPath(c, LOGO_H, s, i * dx * s * 2, i * dy * s * 2); logoPath(c, LOGO_K, s, i * dx * s * 2, i * dy * s * 2); c.fill();
  }
  // face
  const g = c.createLinearGradient(-400 * s, -360 * s, 400 * s, 360 * s);
  g.addColorStop(0, '#2D5BFF'); g.addColorStop(0.45, '#1636B8'); g.addColorStop(1, '#0B1F78');
  c.fillStyle = g; c.beginPath(); logoPath(c, LOGO_H, s); logoPath(c, LOGO_K, s); c.fill();
  // inner top light
  const g2 = c.createLinearGradient(0, -330 * s, 0, 330 * s);
  g2.addColorStop(0, 'rgba(180,210,255,0.35)'); g2.addColorStop(0.35, 'rgba(180,210,255,0)');
  c.fillStyle = g2; c.fill();
  // shine sweep
  if (o.shine !== undefined && o.shine > -0.2 && o.shine < 1.2) {
    c.save(); c.beginPath(); logoPath(c, LOGO_H, s); logoPath(c, LOGO_K, s); c.clip();
    const sx = lerp(-700, 700, o.shine) * s;
    const gs = c.createLinearGradient(sx - 160 * s, -400 * s, sx + 160 * s, 400 * s);
    gs.addColorStop(0, 'rgba(255,255,255,0)'); gs.addColorStop(0.5, 'rgba(230,242,255,0.75)'); gs.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gs; c.fillRect(-600 * s, -400 * s, 1200 * s, 800 * s); c.restore();
  }
  // rim
  c.lineJoin = 'miter'; c.lineWidth = Math.max(1.5, 7 * s);
  c.strokeStyle = o.rim ?? 'rgba(170,205,255,0.95)';
  c.beginPath(); logoPath(c, LOGO_H, s); logoPath(c, LOGO_K, s); c.stroke();
  // draw-on outline (stroke progress)
  c.restore();
}
function drawLogoOutline(c, cx, cy, size, p, alpha = 1) {
  const s = size / 1000; c.save(); c.translate(cx, cy); c.globalAlpha = alpha;
  c.lineWidth = 3; c.strokeStyle = C.cyan; c.shadowColor = C.cyan; c.shadowBlur = 18; c.setLineDash([4000]); c.lineDashOffset = 4000 * (1 - p);
  c.beginPath(); logoPath(c, LOGO_H, s); c.stroke(); c.beginPath(); logoPath(c, LOGO_K, s); c.stroke(); c.restore();
}

// ============================================================
//  sprites & textures
// ============================================================
const grain = (() => { const g = document.createElement('canvas'); g.width = g.height = 256; const x = g.getContext('2d'); const id = x.createImageData(256, 256); const r = rng(3); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); return g; })();
const bokeh = (() => { const b = document.createElement('canvas'); b.width = b.height = 128; const x = b.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(120,170,255,0.9)'); g.addColorStop(0.6, 'rgba(70,120,255,0.35)'); g.addColorStop(1, 'rgba(40,80,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return b; })();
const GLYPHS = '01НК₽%{}<>/=;#01'.split('');

// ============================================================
//  camera (2.5D)
// ============================================================
let cam = { x: 0, y: 0, z: -1000, rot: 0, f: 1000 };
function proj(x, y, z) { const d = z - cam.z; if (d < 10) return null; const s = cam.f / d; let px = (x - cam.x) * s, py = (y - cam.y) * s; const cr = Math.cos(cam.rot), sr = Math.sin(cam.rot); return { x: W / 2 + px * cr - py * sr, y: H / 2 + px * sr + py * cr, s, d }; }
function camAt(t) {
  // continuous drift + scene-specific moves
  const c = { x: Math.sin(t * 0.37) * 60 + Math.sin(t * 0.91) * 18, y: Math.cos(t * 0.29) * 40, z: -1000 + t * 120, rot: Math.sin(t * 0.23) * 0.02, f: 1000 };
  // fly-through at logo->hook
  c.z += eInX(seg(t, 7.2, 8.0)) * 900;
  c.rot += eIO(seg(t, 13.2, 14)) * 0.06 - eIO(seg(t, 21.4, 22)) * 0.06;
  c.x += eIOX(seg(t, 21.5, 22.1)) * 600 - eIOX(seg(t, 21.5, 22.1)) * 600 * seg(t, 22.09, 22.1);
  c.z += eInX(seg(t, 31.6, 32.05)) * 800;
  c.z += eInX(seg(t, 59.3, 60)) * 1000;
  return c;
}

// ============================================================
//  background world
// ============================================================
const PARTS = (() => { const r = rng(11), a = []; for (let i = 0; i < 300; i++) a.push({ x: (r() - .5) * 5000, y: (r() - .5) * 3000, z: r() * 9000, g: GLYPHS[(r() * GLYPHS.length) | 0], sp: 0.3 + r(), ph: r() * 6.28 }); return a; })();
const BOKEH = (() => { const r = rng(21), a = []; for (let i = 0; i < 40; i++) a.push({ x: (r() - .5) * 4000, y: (r() - .5) * 2400, z: r() * 9000, sz: 40 + r() * 120 }); return a; })();

function drawBG(t, o) {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, 50, W / 2, H / 2, W * 0.75);
  const hue = o.warm ?? 0;
  g.addColorStop(0, `rgb(${10 + hue * 20},${28 + hue * 20},${90 + hue * 60})`); g.addColorStop(0.5, '#040E33'); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // perspective grid floor + ceiling
  if (o.grid > 0) {
    ctx.save(); ctx.lineWidth = 1.2;
    for (const plane of [520, -900]) {
      const zOff = (cam.z % 250 + 250) % 250;
      for (let i = 0; i < 40; i++) {
        const z = cam.z + 60 + i * 250 - zOff;
        const p1 = proj(-4000, plane, z), p2 = proj(4000, plane, z); if (!p1 || !p2) continue;
        const a = clamp(1 - i / 40) * o.grid * (plane > 0 ? 0.55 : 0.18);
        ctx.strokeStyle = `rgba(80,130,255,${a})`; ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      for (let xi = -16; xi <= 16; xi++) {
        const x = xi * 250 + Math.round(cam.x / 250) * 250;
        const p1 = proj(x, plane, cam.z + 60), p2 = proj(x, plane, cam.z + 10000); if (!p1 || !p2) continue;
        const gr = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
        const a = o.grid * (plane > 0 ? 0.45 : 0.14);
        gr.addColorStop(0, `rgba(80,130,255,${a})`); gr.addColorStop(1, 'rgba(80,130,255,0)');
        ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
    }
    ctx.restore();
  }
  // bokeh
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const z = ((b.z - cam.z) % 9000 + 9000) % 9000 + cam.z + 50;
    const p = proj(b.x, b.y, z); if (!p) continue;
    const sz = b.sz * p.s * 3; ctx.globalAlpha = 0.18 * (o.bokeh ?? 1) * clamp(p.s * 3);
    ctx.drawImage(bokeh, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.restore();
  // glyph particles
  if ((o.glyph ?? 1) > 0) {
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const q of PARTS) {
      const z = ((q.z - cam.z) % 9000 + 9000) % 9000 + cam.z + 40;
      const p = proj(q.x + Math.sin(t * q.sp + q.ph) * 40, q.y + Math.cos(t * q.sp * 0.7 + q.ph) * 30, z); if (!p) continue;
      const near = clamp(1 - p.d / 9000);
      ctx.globalAlpha = near * near * 0.55 * (o.glyph ?? 1);
      ctx.fillStyle = hash(q.ph) > 0.85 ? C.cyan : C.sky;
      ctx.font = `600 ${Math.max(4, 60 * p.s) | 0}px ${FM}`; ctx.fillText(q.g, p.x, p.y);
    }
    ctx.restore();
  }
}

function post(t, o) {
  // bloom
  bctx.clearRect(0, 0, W / 4, H / 4);
  bctx.filter = 'brightness(0.75) contrast(2.2) blur(5px)';
  bctx.drawImage(buf, 0, 0, W / 4, H / 4); bctx.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55 + (o.bloom ?? 0);
  ctx.drawImage(bloomC, 0, 0, W, H); ctx.restore();
  // flash
  if (o.flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(150,190,255,${o.flash})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,2,12,0.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // scanlines
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = '#000'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2); ctx.restore();
  // grain
  ctx.save(); ctx.globalAlpha = 0.06; ctx.globalCompositeOperation = 'overlay';
  const ox = (hash(t * 60) * 256) | 0, oy = (hash(t * 60 + 9) * 256) | 0;
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
  // fade
  if (o.black > 0) { ctx.fillStyle = `rgba(0,1,6,${o.black})`; ctx.fillRect(0, 0, W, H); }
}

// ============================================================
//  UI primitives
// ============================================================
function glass(x, y, w, h, r = 26, a = 1, border = 'rgba(150,190,255,0.55)') {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
  g.addColorStop(0, 'rgba(60,100,230,0.38)'); g.addColorStop(1, 'rgba(10,25,90,0.55)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  const g2 = ctx.createLinearGradient(x, y, x, y + h * 0.5); g2.addColorStop(0, 'rgba(255,255,255,0.12)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g2; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = border; ctx.stroke();
  ctx.restore();
}
function text(str, x, y, size, o = {}) {
  ctx.save();
  ctx.font = `${o.w ?? 800} ${size}px ${o.f ?? FD}`;
  ctx.textAlign = o.align ?? 'center'; ctx.textBaseline = o.base ?? 'middle';
  ctx.globalAlpha *= o.a ?? 1;
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.glow) { ctx.shadowColor = o.glowC ?? 'rgba(90,150,255,0.9)'; ctx.shadowBlur = o.glow; }
  if (o.grad) { const m = ctx.measureText(str); const g = ctx.createLinearGradient(x, y - size / 2, x, y + size / 2); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#9EC0FF'); ctx.fillStyle = g; } else ctx.fillStyle = o.c ?? C.white;
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.c ?? C.white; ctx.strokeText(str, x, y); } else ctx.fillText(str, x, y);
  ctx.restore();
}
// per-letter kinetic text. mode: 'drop' | 'z' | 'slide'
function kinetic(str, x, y, size, t0, t, o = {}) {
  const baseA = ctx.globalAlpha; if (baseA <= 0.001) return 0;
  ctx.save(); ctx.font = `${o.w ?? 900} ${size}px ${o.f ?? FD}`; if (o.ls) ctx.letterSpacing = o.ls + 'px';
  const full = ctx.measureText(str).width; let cx = x - (o.align === 'left' ? 0 : full / 2);
  const stag = o.stag ?? 0.035, dur = o.dur ?? 0.55;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (let i = 0; i < str.length; i++) {
    const ch = str[i]; const w = ctx.measureText(ch).width + (o.ls || 0);
    const lt = (t - t0 - i * stag) / dur;
    if (lt > 0) {
      const p = clamp(lt); const sp = o.mode === 'drop' ? eBack(clamp(lt)) : eOutX(p);
      ctx.save();
      let ty = 0, sc = 1, a = clamp(lt * 3), rot = 0, tx = 0;
      if (o.mode === 'drop') { ty = (1 - sp) * -size * 1.4; rot = (1 - sp) * (hash(i) - .5) * 0.6; }
      else if (o.mode === 'z') { sc = lerp(3.2, 1, sp); a = clamp(lt * 2.2); }
      else { ty = (1 - sp) * size * 0.9; }
      if (o.out !== undefined && t > o.out) { const q = eInC(seg(t, o.out + i * 0.012, o.out + 0.35 + i * 0.012)); a *= 1 - q; ty -= q * size * 0.6; tx += q * (o.outX ?? 0); }
      ctx.globalAlpha = baseA * a * (o.a ?? 1);
      ctx.translate(cx + w / 2 + tx, y + ty); ctx.rotate(rot); ctx.scale(sc, sc);
      if (o.glow) { ctx.shadowColor = 'rgba(80,140,255,0.95)'; ctx.shadowBlur = o.glow; }
      if (o.gradFill) { const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, o.c2 ?? '#8FB4FF'); ctx.fillStyle = g; } else ctx.fillStyle = o.c ?? C.white;
      ctx.fillText(ch, -w / 2 + (o.ls || 0) / 2, 0);
      ctx.restore();
    }
    cx += w;
  }
  ctx.restore();
  return full;
}
function glitchText(str, x, y, size, amt, t, o = {}) {
  ctx.save(); ctx.font = `${o.w ?? 900} ${size}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const m = ctx.measureText(str).width;
  const slices = 9;
  for (let i = 0; i < slices; i++) {
    const y0 = y - size * 0.6 + (size * 1.2) * i / slices, hh = size * 1.2 / slices;
    const off = (hash(i * 13 + Math.floor(t * 30)) - 0.5) * 80 * amt;
    ctx.save(); ctx.beginPath(); ctx.rect(x - m, y0, m * 2, hh + 1); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,40,90,${0.8 * amt})`; ctx.fillText(str, x + off - 10 * amt, y);
    ctx.fillStyle = `rgba(40,220,255,${0.8 * amt})`; ctx.fillText(str, x + off + 10 * amt, y);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = o.c ?? C.white; ctx.globalAlpha = o.a ?? 1; ctx.fillText(str, x + off, y);
    ctx.restore();
  }
  ctx.restore();
  return m;
}
function brackets(x, y, w, h, len, a) {
  ctx.save(); ctx.strokeStyle = `rgba(140,185,255,${a})`; ctx.lineWidth = 3;
  const P = [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]];
  for (const [px, py, sx, sy] of P) { ctx.beginPath(); ctx.moveTo(px + sx * len, py); ctx.lineTo(px, py); ctx.lineTo(px, py + sy * len); ctx.stroke(); }
  ctx.restore();
}
function shock(x, y, p, maxR, a = 1, col = '120,180,255') {
  if (p <= 0 || p >= 1) return; const r = eOutC(p) * maxR;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${col},${(1 - p) * a})`; ctx.lineWidth = 30 * (1 - p) + 2; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.restore();
}
function streaks(p, a) {
  if (a <= 0) return; const r = rng(77); ctx.save(); ctx.globalCompositeOperation = 'lighter';

    text('налоговый-колледж.рф', cx, cy + LS * 0.47 + 90, 30, { f: FM, w: 600, ls: 4, c: C.cyan, a: seg(t, 68.6, 69) });
  }
}

//  FRAME

function scene(t) {
  const grid = 0.35 + 0.65 * (seg(t, 8, 9) * (1 - seg(t, 59.5, 60.5) * 0.5));
  drawBG(t, { grid: grid * (t < 4 ? 0.2 : 1), glyph: t < 3.5 ? 0.25 : 1, bokeh: t < 3.5 ? 0.4 : 1 });
  sTerm(t); sLogo(t); sHook(t); sCode(t); sPrac(t); sFns(t); sDip(t); sTeam(t); sBuild(t); sCta(t); sPack(t);
  hud(t);
}
const FLASH = [[ENTER_T, 0.5], [6.0, 0.55], [8.0, 0.7], [10.75, 0.35], [14.0, 0.3], [22.05, 0.3], [25, 0.35], [32.0, 0.75], [37.45, 0.4], [56.0, 0.9], [60.0, 0.5], [63.2, 0.25], [68.0, 0.6]];
function render(t, sub = 3) {
  // motion blur: average sub-frames across half a frame (shutter 180°)
  const dt = 1 / 60 * 0.5;
  out.globalCompositeOperation = 'source-over';
  for (let i = 0; i < sub; i++) {
    const tt = t + (sub > 1 ? (i / (sub - 1) - 0.5) * dt : 0);
    cam = camAt(tt);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, W, H);
    scene(tt);
    let flash = 0; for (const [ft, fa] of FLASH) flash += fa * Math.exp(-Math.max(0, tt - ft) * 9) * (tt >= ft ? 1 : 0);
    const black = (1 - seg(tt, 0, 0.35)) + seg(tt, 55.5, 55.52) * (1 - seg(tt, 55.98, 56.0)) * 0.9 + seg(tt, 69.6, 70);
    post(tt, { flash: Math.min(1, flash), black: Math.min(1, black) });
    out.globalAlpha = 1 / (i + 1);
    out.drawImage(buf, 0, 0);
  }
  out.globalAlpha = 1;
}

[[8.0, 'drop1'], [32.0, 'drop1'], [6.0, 'impact'], [10.0, 'glitch'], [10.75, 'impact'], [13.5, 'whoosh2'], [21.5, 'whoosh2'], [14.5, 'whoosh'], [12.25, 'hit']].forEach(([t, k]) => ev(t, k));
[11.25, 11.75].forEach(t => ev(t, 'whoosh', 0.5));
window.EVENTS = EV.sort((a, b) => a.t - b.t);
window.render = render;
window.DUR = DUR;
window.ready = document.fonts.ready.then(() => document.fonts.load(`900 40px Unbounded`)).then(() => document.fonts.load(`400 40px Unbounded`)).then(() => { render(0.5, 1); return true; });

const qs = new URLSearchParams(location.search);
if (qs.has('play')) { window.ready.then(() => { const st = performance.now() - (+qs.get('play') || 0) * 1000; const loop = () => { render(((performance.now() - st) / 1000) % DUR, 1); requestAnimationFrame(loop); }; loop(); }); }
else if (qs.has('t')) window.ready.then(() => render(+qs.get('t'), 1));
