<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Газа. Ночь</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
  #ui{position:fixed;left:12px;bottom:10px;color:#999;font:13px Inter,sans-serif;display:flex;gap:10px;align-items:center}
  #ui button{background:#222;color:#ddd;border:1px solid #444;padding:6px 12px;cursor:pointer}
  body.render #ui{display:none}

</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="play">▶ Смотреть</button><span id="tc">загрузка…</span></div>
<audio id="aud" src="audio/mix.m4a" preload="auto"></audio>
<script>
'use strict';
// ============================================================
//  Газа. Ночь — 30 c. Детерминированный таймлайн: frame(t)
// ============================================================
const W=1920,H=1080,DUR=30,FPS=60;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- утилиты
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const eIn=t=>{t=clamp(t);return t*t*t};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
function bounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const pulse=(t,h,k)=>t>=h?Math.exp(-(t-h)*k):0;

// мазок кисти
function strokes(g,o){
  const {x=0,y=0,w,h,n,cols,ang=0,av=.3,len=[20,60],th=[3,8],a=[.5,1],seed=1}=o;
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const px=x+r()*w,py=y+r()*h;
    const L=lerp(len[0],len[1],r()),T=lerp(th[0],th[1],r());
    const an=(typeof ang==='function'?ang(px,py):ang)+(r()-.5)*2*av;
    const c=typeof cols==='function'?cols(px-x,py-y,r):cols[(r()*cols.length)|0];
    const al=lerp(a[0],a[1],r());
    const ca=Math.cos(an),sa=Math.sin(an);
    g.setTransform(ca,sa,-sa,ca,px,py);g.globalAlpha=al;g.fillStyle=c;
    g.beginPath();g.moveTo(-L/2,0);g.quadraticCurveTo(-L/4,-T/2,L/2,-T*.18);g.quadraticCurveTo(L/4,T/2,-L/2,0);g.fill();
  }
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
}

// кеш размытых версий статичных слоёв
const blurCache=new Map();
function blurred(img,b){
  b=Math.round(b/1.5)*1.5; if(b<=0.4) return img;
  let m=blurCache.get(img); if(!m){m=new Map();blurCache.set(img,m)}
  if(m.has(b)) return m.get(b);
  const c=mk(img.width,img.height),g=c.getContext('2d');g.filter=`blur(${b}px)`;g.drawImage(img,0,0);m.set(b,c);return c;
}

// ---------- камера
let cam={x:0,y:0,z:1,r:0};
function layer(g,img,x,y,{p=1,s=1,blur=0,alpha=1,comp='source-over'}={}){
  const z=1+(cam.z-1)*p;
  g.save();g.translate(W/2,H/2);g.rotate(cam.r*p);g.scale(z,z);g.translate(-cam.x*p,-cam.y*p);
  g.globalAlpha=alpha;g.globalCompositeOperation=comp;
  g.drawImage(blur?blurred(img,blur):img,x,y,img.width*s,img.height*s);g.restore();
}
function camT(g,p){const z=1+(cam.z-1)*p;g.translate(W/2,H/2);g.rotate(cam.r*p);g.scale(z,z);g.translate(-cam.x*p,-cam.y*p)}
function toScreen(x,y,p){const z=1+(cam.z-1)*p;let X=(x-cam.x*p)*z,Y=(y-cam.y*p)*z;const c=Math.cos(cam.r*p),s=Math.sin(cam.r*p);return[W/2+X*c-Y*s,H/2+X*s+Y*c,z]}

// ---------- удары, тряска, вспышки (по музыке)
const HITS=[[3.75,1],[5.04,.5],[13.42,.22],[14.12,.26],[15.05,.32],[16.74,.5],[17.07,.32],[18.18,.4],[18.9,.28],[19.5,.3]];
function shake(t){let s=0;for(const[h,a]of HITS)s+=a*pulse(t,h,4.5);return s}
function applyShake(t){const a=shake(t);cam.x+=a*30*(Math.sin(t*47.3)+.6*Math.sin(t*83.1+1.3));cam.y+=a*24*(Math.sin(t*53.7+2)+.5*Math.sin(t*97.9));cam.r+=a*.007*Math.sin(t*41+.5)}
const FLASH=[[3.75,1,'255,236,210',5.5],[5.04,.45,'255,200,150',6],[12.86,.45,'255,90,40',4],[13.42,.22,'255,120,60',5],[14.12,.28,'255,120,60',5],[15.05,.34,'255,130,70',5],[16.74,.75,'255,225,195',6],[17.07,.25,'255,170,110',7],[18.18,.32,'255,170,110',7],[18.9,.2,'255,170,110',7],[19.5,.22,'255,170,110',7],[20.11,.22,'255,190,150',5],[26.26,.12,'255,150,110',3]];

// ============================================================
//  Слои (строятся один раз)
// ============================================================
const L={};
function skyCanvas(seed,w,h,fn){
  const c=mk(w,h),g=c.getContext('2d');g.fillStyle=fn(.5,rng(seed),true);g.fillRect(0,0,w,h);
  strokes(g,{w,h,n:Math.round(w*h/240),cols:(x,y,r)=>fn(y/h,r),ang:0,av:.07,len:[50,190],th:[7,17],a:[.55,.95],seed:seed+1});
  return c;
}
function ruinsCanvas(seed,w,h,{minH,maxH,cols,holes=true}){
  const c=mk(w,h),g=c.getContext('2d'),r=rng(seed);const tops=[];
  g.beginPath();g.moveTo(0,h);let x=0;
  while(x<w){
    const bw=70+r()*230,bh=minH+r()*(maxH-minH),y0=h-bh;
    g.lineTo(x,h-bh*(.55+r()*.45));
    const k=3+(r()*5|0);
    for(let i=1;i<=k;i++){g.lineTo(x+bw*i/k,y0+(r()<.4?r()*bh*.55:r()*22))}
    tops.push([x,bw,y0,bh]);x+=bw;
    if(r()<.3){g.lineTo(x+10,h-r()*40);x+=20+r()*60;g.lineTo(x,h-r()*40)}
  }
  g.lineTo(w,h);g.closePath();g.save();g.clip();
  g.fillStyle=cols[0];g.fillRect(0,0,w,h);
  strokes(g,{w,h,n:Math.round(w*h/320),cols,ang:Math.PI/2,av:.6,len:[20,70],th:[4,10],a:[.5,1],seed:seed+3});
  g.restore();
  if(holes){g.globalCompositeOperation='destination-out';
    for(const[bx,bw,y0,bh]of tops){const rows=(bh/72)|0,cn=Math.max(1,(bw/60)|0);
      for(let i=0;i<rows;i++)for(let j=0;j<cn;j++){if(r()<.5){
        const ww=(bw-24)/cn*.55,wh=28+r()*12,wx=bx+12+j*(bw-24)/cn+r()*4,wy=y0+44+i*72+r()*6;
        g.beginPath();g.moveTo(wx,wy);g.lineTo(wx+ww,wy+r()*5);g.lineTo(wx+ww-r()*5,wy+wh);g.lineTo(wx+r()*6,wy+wh);g.fill();}}}
    g.globalCompositeOperation='source-over';}
  g.strokeStyle=cols[0];g.lineCap='round';
  for(const[bx,bw,y0]of tops){const n=r()*5|0;for(let i=0;i<n;i++){const xx=bx+r()*bw;g.lineWidth=1.5+r()*2;g.beginPath();g.moveTo(xx,y0+25);g.quadraticCurveTo(xx+(r()-.5)*30,y0-15,xx+(r()-.5)*60,y0-25-r()*35);g.stroke()}}
  c.tops=tops;return c;
}
function rubbleCanvas(seed,w,h,cols){
  const c=mk(w,h),g=c.getContext('2d'),r=rng(seed);
  // торчащие плиты
  for(let i=0;i<14;i++){const x=r()*w,y=h*.42+r()*h*.2,sw=60+r()*200,sh=14+r()*22,a=(r()-.5)*1.4;
    g.save();g.translate(x,y);g.rotate(a);g.fillStyle=cols[(r()*cols.length)|0];g.fillRect(-sw/2,-sh/2,sw,sh);g.restore();
    g.strokeStyle=cols[0];g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-.5)*80,y-40-r()*60);g.stroke();}
  g.beginPath();g.moveTo(0,h);
  for(let x=0;x<=w;x+=30)g.lineTo(x,h*.5+Math.sin(x*.004+seed)*h*.14+Math.sin(x*.013)*h*.05+r()*26);
  g.lineTo(w,h);g.closePath();g.save();g.clip();g.fillStyle=cols[0];g.fillRect(0,0,w,h);
  strokes(g,{w,h,n:Math.round(w*h/220),cols,ang:0,av:1.6,len:[12,46],th:[5,14],a:[.6,1],seed:seed+5});
  for(let i=0;i<110;i++){const x=r()*w,y=h*.45+r()*h*.55,s=14+r()*60;g.fillStyle=cols[(r()*cols.length)|0];g.globalAlpha=.7+r()*.3;g.beginPath();const k=4+(r()*3|0);
    for(let j=0;j<k;j++){const a=j/k*6.28+r()*.5;g.lineTo(x+Math.cos(a)*s*(.6+r()*.6),y+Math.sin(a)*s*.55*(.6+r()*.6))}g.fill()}
  g.restore();g.globalAlpha=1;return c;
}
function wallCanvas(seed){
  const w=1700,h=1100,c=mk(w,h),g=c.getContext('2d'),r=rng(seed);
  const pts=[[0,200],[160,130],[250,210],[420,70],[520,140],[700,40],[820,120],[980,30],[1080,150],[1200,95],[1330,210],[1450,160],[1560,270],[1700,240]];
  g.beginPath();g.moveTo(0,h);pts.forEach(p=>g.lineTo(p[0]+(r()-.5)*24,p[1]+(r()-.5)*24));g.lineTo(w,h);g.closePath();g.save();g.clip();
  g.fillStyle='#3a3128';g.fillRect(0,0,w,h);
  strokes(g,{w,h,n:11000,cols:(x,y,r)=>hsl(26+r()*12,9+r()*12,17+r()*22),ang:0,av:1.5,len:[14,50],th:[4,10],a:[.5,.9],seed:seed+1});
  // флаг Палестины, нарисованный на стене: чёрный / белый / зелёный, красный треугольник у древка
  const fx=230,fy=300,fw=1200,fh=600;c.flag=[fx,fy,fw,fh];
  const stripe=(y0,cols,s)=>{g.save();g.beginPath();g.rect(fx,y0,fw,fh/3+1);g.clip();
    strokes(g,{x:fx-20,y:y0-10,w:fw+40,h:fh/3+20,n:3200,cols,ang:0,av:.1,len:[30,95],th:[6,13],a:[.75,1],seed:s});g.restore()};
  stripe(fy,['#141414','#1e1b19','#0c0c0c','#28241f'],seed+11);
  stripe(fy+fh/3,['#ebe5d8','#d9d2c3','#f3efe5','#cbc3b2'],seed+12);
  stripe(fy+2*fh/3,['#0f7a3d','#138244','#0b6a34','#1b8c4b'],seed+13);
  g.save();g.beginPath();g.moveTo(fx,fy);g.lineTo(fx+fw*.36,fy+fh/2);g.lineTo(fx,fy+fh);g.closePath();g.clip();
  strokes(g,{x:fx-10,y:fy-10,w:fw*.4,h:fh+20,n:2200,cols:['#c8102e','#b10e28','#d81e3a','#9e0c22'],ang:-.3,av:.45,len:[25,70],th:[6,12],a:[.8,1],seed:seed+14});g.restore();
  // сколы штукатурки по флагу
  strokes(g,{x:fx,y:fy,w:fw,h:fh,n:420,cols:(x,y,r)=>hsl(28,10,22+r()*18),ang:0,av:1.6,len:[6,26],th:[4,10],a:[.7,1],seed:seed+21});
  // копоть
  strokes(g,{w,h,n:1600,cols:['#0b0907','#16120e'],ang:Math.PI/2,av:.5,len:[30,140],th:[3,12],a:[.06,.3],seed:seed+20});
  // трещины
  g.strokeStyle='rgba(8,6,5,.85)';g.lineCap='round';
  for(let i=0;i<16;i++){let x=r()*w,y=r()<.5?100+r()*80:r()*h,a=Math.PI/2+(r()-.5)*1.5;g.lineWidth=1.2+r()*3;g.beginPath();g.moveTo(x,y);
    for(let k=0;k<14;k++){a+=(r()-.5)*.9;x+=Math.cos(a)*30;y+=Math.sin(a)*30;g.lineTo(x,y)}g.stroke()}
  // следы от пуль
  for(let i=0;i<55;i++){const x=r()*w,y=150+r()*(h-200),rr=3+r()*9;const gr=g.createRadialGradient(x,y,0,x,y,rr*2.2);
    gr.addColorStop(0,'rgba(5,4,3,.95)');gr.addColorStop(.45,'rgba(20,16,12,.8)');gr.addColorStop(.7,'rgba(150,135,115,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,rr*2.2,0,7);g.fill()}
  g.restore();return c;
}
function texCanvas(w,h,seed,base,cols,n,o={}){const c=mk(w,h),g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,h);strokes(g,Object.assign({w,h,n,cols,ang:0,av:1.6,len:[14,50],th:[4,10],a:[.5,.95],seed},o));return c}
function fireballCanvas(){
  const s=512,c=mk(s,s),g=c.getContext('2d');
  strokes(g,{w:s,h:s,n:2600,cols:(x,y,r)=>{const d=Math.hypot(x-s/2,y-s/2)/(s/2);return hsl(15+40*(1-d)+r()*10,95,35+55*(1-d)*(1-d)+r()*8)},ang:(x,y)=>Math.atan2(y-s/2,x-s/2),av:.25,len:[20,70],th:[5,12],a:[.6,1],seed:91});
  g.globalCompositeOperation='destination-in';const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'#000');gr.addColorStop(.55,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return c;
}
function puffCanvas(seed,dark){
  const s=400,c=mk(s,s),g=c.getContext('2d');
  strokes(g,{w:s,h:s,n:1400,cols:(x,y,r)=>dark?hsl(20,8,6+r()*14):hsl(30,8,30+r()*25),ang:(x,y)=>Math.atan2(y-s/2,x-s/2)+1.4,av:.4,len:[20,60],th:[8,18],a:[.4,.9],seed});
  g.globalCompositeOperation='destination-in';const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(0,0,0,.85)');gr.addColorStop(.6,'rgba(0,0,0,.5)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);
  const b=mk(s,s);const bg=b.getContext('2d');bg.filter='blur(6px)';bg.drawImage(c,0,0);return b;
}
function windowWallCanvas(seed){ // стена комнаты с проломом-окном
  const w=2800,h=1700,c=texCanvas(w,h,seed,'#120e0c',[ '#100c0a','#1a1411','#0b0908','#221a15'],w*h/230,{ang:Math.PI/2,av:.4});
  const g=c.getContext('2d'),r=rng(seed+3);g.globalCompositeOperation='destination-out';g.beginPath();
  const cx=1500,cy=640,rx=820,ry=460;for(let i=0;i<40;i++){const a=i/40*6.283;const k=.75+r()*.35;g.lineTo(cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k*(a>0&&a<3.14?.8:1))}g.fill();
  g.globalCompositeOperation='source-over';g.strokeStyle='#0a0807';g.lineWidth=3;
  for(let i=0;i<9;i++){const x=cx-rx+r()*rx*2;g.beginPath();g.moveTo(x,cy-ry*1.1);g.quadraticCurveTo(x+(r()-.5)*80,cy-ry*.7,x+(r()-.5)*120,cy-ry*.55);g.stroke()}
  return c;
}
function crowdRow(seed,n,w,hh,col,haze){
  const c=mk(w,hh*2.2),g=c.getContext('2d'),r=rng(seed);c.figs=[];
  g.fillStyle=L.navyPat;
  for(let i=0;i<n;i++){const x=(i+.5)/n*w+(r()-.5)*w/n*.6,s=hh*(.85+r()*.3),base=hh*2.2;
    const y=base-s*1.05+r()*s*.15;c.figs.push([x,y,s]);
    g.beginPath();g.ellipse(x,y,s*.13,s*.15,0,0,7);
    g.moveTo(x-s*.42,base);g.quadraticCurveTo(x-s*.4,y+s*.28,x-s*.16,y+s*.2);g.quadraticCurveTo(x,y+s*.12,x+s*.16,y+s*.2);g.quadraticCurveTo(x+s*.4,y+s*.28,x+s*.42,base);g.closePath();g.fill();
    if(r()<.4){g.beginPath();g.ellipse(x,y-s*.02,s*.16,s*.19,0,Math.PI,0);g.fill()} }
  if(haze){g.globalCompositeOperation='source-atop';g.fillStyle=haze;g.fillRect(0,0,c.width,c.height)}
  return c;
}
async function build(){
  const fams=["900 100px 'Inter Display'","italic 400 60px 'FreeSerif'","400 60px 'FreeSerif'"];
  try{await Promise.all(fams.map(f=>document.fonts.load(f,'АБВабв')))}catch(e){}
  L.skyNight=skyCanvas(11,2600,1400,(v,r,b)=>b?'#100b22':hsl(242+(r()-.5)*28,28+r()*28,5+24*r()*Math.max(0,1-Math.abs(v-.42)*1.6)+3*(1-v)));
  L.skyFire=skyCanvas(21,2600,1400,(v,r,b)=>b?'#2a0a06':hsl(4+r()*30,70+r()*25,6+46*Math.pow(v,1.6)*(.4+r()*.6)));
  L.skyAsh=skyCanvas(31,2600,1400,(v,r,b)=>b?'#4a423a':hsl(24+r()*16,6+r()*12,22+r()*20+12*(1-v)));
  L.ground=skyCanvas(41,3000,700,(v,r,b)=>b?'#140d08':hsl(22+r()*12,22+r()*18,4+r()*11));
  L.ruinsFar=ruinsCanvas(51,2900,440,{minH:110,maxH:340,cols:['#130e20','#1a1430','#0f0b1a','#201837']});
  L.ruinsMid=ruinsCanvas(61,3100,640,{minH:200,maxH:560,cols:['#0b0911','#141019','#1b1620','#09080c']});
  L.ruinsAshFar=ruinsCanvas(71,2900,460,{minH:120,maxH:380,cols:['#3d3732','#47413a','#35302b']});
  L.ruinsAshMid=ruinsCanvas(81,3100,660,{minH:220,maxH:580,cols:['#1f1a16','#2a241f','#18130f','#332b24']});
  L.rubble=rubbleCanvas(91,3300,560,['#120d0a','#1d1612','#2a211a','#0d0a08']);
  L.rubbleAsh=rubbleCanvas(97,3300,560,['#26201b','#3a3029','#4b4037','#1a1512']);
  L.wall=wallCanvas(101);
  L.navy=texCanvas(512,512,111,'#0d1124',['#0b0f22','#141a36','#1c2446','#090c18'],2600);
  L.navyPat=ctx.createPattern(L.navy,'repeat');
  L.skin=texCanvas(256,256,121,'#6e4630',['#7d5238','#5e3a27','#8a5d40'],700);L.skinPat=ctx.createPattern(L.skin,'repeat');
  L.paper=texCanvas(256,256,131,'#e9e2d3',['#efe9dc','#dcd3c2','#f6f2ea','#cfc6b4'],700,{len:[10,30]});L.textPat=ctx.createPattern(L.paper,'repeat');
  L.table=texCanvas(2600,1500,141,'#1c120b',['#24170e','#160e08','#2e1d11','#3a2616'],2600*1500/260,{ang:-.35,av:.08,len:[80,260],th:[5,12]});
  L.ceramic=texCanvas(700,500,151,'#cfcac2',['#dcd8d0','#bdb7ad','#e8e4dd','#a9a399'],2400,{len:[10,40]});
  L.winWall=windowWallCanvas(171);
  L.fireball=fireballCanvas();L.puff=puffCanvas(181,true);L.puffLight=puffCanvas(191,false);
  L.crowdBack=crowdRow(201,26,3000,150,null,'rgba(40,30,45,.55)');
  L.crowdMid=crowdRow(211,18,3000,220,null,'rgba(15,12,22,.25)');
  L.crowdFront=crowdRow(221,11,3200,330,null,null);
  // зерно и виньетка
  L.grain=[0,1,2].map(k=>{const c=mk(960,540),g=c.getContext('2d'),id=g.createImageData(960,540),r=rng(300+k);for(let i=0;i<id.data.length;i+=4){const v=128+(r()-.5)*150;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return c});

  g.bezierCurveTo(...P(.14,-.69),...P(.12,-.68),...P(.10,-.67));

const FH="'Inter Display','Inter',sans-serif",FS="'FreeSerif','DejaVu Serif',serif";
function heavy(g,str,x,y,size,t0,t,o={}){
  const {t1=1e9,align='center',col=null,stag=.035,mode='slam',track=.04}=o;
  if(t<t0)return;g.save();g.font=`900 ${size}px ${FH}`;g.textBaseline='middle';g.textAlign='left';
  const ch=[...str],ws=ch.map(c=>g.measureText(c).width+size*track),tot=ws.reduce((a,b)=>a+b,0)-size*track;
  let cx=align==='center'?x-tot/2:align==='left'?x:x-tot;
  ch.forEach((c,i)=>{const w=ws[i],lt=t-t0-i*stag;if(lt<0||c===' '){cx+=w;return}
    const r=rng(i*31+str.length*7+Math.round(t0*100)),r1=r(),r2=r();
    let a=1,sc=1,dy=0,bl=0,rot=0;
    if(mode==='slam'){const p=clamp(lt/.2);sc=lerp(2.1,1,eOut(p));a=clamp(lt/.07);bl=(1-p)*12}
    else if(mode==='drop'){const p=clamp(lt/.45);dy=-(1-bounce(p))*170;a=clamp(lt/.05);rot=(1-p)*(r1-.5)*.8}
    else if(mode==='rise'){const p=clamp(lt/.6);dy=(1-eOut(p))*50;a=eOut(p);bl=(1-p)*14}
    const et=t-t1-i*.03;if(et>0){const p=clamp(et/.7);a*=1-p;dy-=p*p*90*(.5+r1);rot+=(r2-.5)*p*1.4;bl+=p*16}
    if(a<=.002){cx+=w;return}
    g.save();g.translate(cx+(w-size*track)/2,y+dy);g.rotate(rot);g.scale(sc,sc);g.globalAlpha=a;if(bl>.4)g.filter=`blur(${bl.toFixed(1)}px)`;
    const hw=(w-size*track)/2;g.fillStyle='rgba(0,0,0,.6)';g.fillText(c,-hw+size*.035,size*.045);
    g.fillStyle=col||L.textPat;g.fillText(c,-hw,0);g.restore();cx+=w});
  g.restore();
}
function quiet(g,str,x,y,size,t0,t1,t,o={}){

const SC=[{a:0,b:7.04,f:sCity},{a:7.04,b:10.75,f:sRuins},{a:10.75,b:12.86,f:sPlate},{a:12.86,b:16.74,f:sMother},{a:16.74,b:20.11,f:sSky},{a:20.11,b:99,f:sWall}];

const B1=mk(W,H),b1=B1.getContext('2d'),B2=mk(W,H),b2=B2.getContext('2d'),B3=mk(W,H),b3=B3.getContext('2d');
function reset(g){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.fillStyle='#000';g.fillRect(0,0,W,H)}
function drawScene(g,i,t){reset(g);cam={x:0,y:0,z:1,r:0};SC[i].f(g,t-SC[i].a,t)}
function drawAt(g,t){
  const tr=TR.find(o=>t>=o.t0&&t<o.t1);
  if(tr){const p=ease(seg(t,tr.t0,tr.t1));drawScene(b2,tr.from,t);drawScene(b3,tr.to,t);reset(g);g.drawImage(B2,0,0);g.globalAlpha=p;g.drawImage(B3,0,0);g.globalAlpha=1;

    g.fillStyle=`rgba(150,140,130,${Math.sin(p*Math.PI)*.25})`;g.fillRect(0,0,W,H);return}

}
function motion(t){let m=shake(t);for(const[h,ax,ay,bx,by]of SKY_HITS)if(t>h-.35&&t<h+.4)m+=.2;if(t>3.1&&t<5.2)m+=.3;return m}
function post(g,t){
  g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;
  let fr=0,fg=0,fb=0;for(const[h,a,c,k]of FLASH){const v=a*(t>=h-.03?Math.exp(-Math.max(0,t-h)*k)*(t<h?(t-h+.03)/.03:1):0);if(v<=0)continue;const[r,gg,b]=c.split(',').map(Number);fr+=r*v;fg+=gg*v;fb+=b*v}
  if(fr+fg+fb>1){g.globalCompositeOperation='screen';g.fillStyle=`rgb(${Math.min(255,fr)|0},${Math.min(255,fg)|0},${Math.min(255,fb)|0})`;g.fillRect(0,0,W,H)}

  const st=1-seg(t,0,.35);if(st>0){g.fillStyle=`rgba(0,0,0,${st})`;g.fillRect(0,0,W,H)}

function frame(t){
  const m=motion(t),n=m>.12?4:1;
  if(n===1)drawAt(ctx,t);
  else{reset(ctx);for(let k=0;k<n;k++){drawAt(b1,t-k/n*(.8/FPS));ctx.globalAlpha=1/(k+1);ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(B1,0,0)}ctx.globalAlpha=1}
  post(ctx,t);
}
